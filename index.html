  const [editing, setEditing]       = useState(null);
  const [form, setForm]             = useState({ code:"", type:"Discount", tier:"Any", discountType:"% off", value:"", duration:"One-time", singleUse:false, onePerEmail:true, maxUses:"", starts:"", expires:"", campaign:"", notes:"", promoMsg:"", bulkCount:"" });

  const filtered = codes.filter(c => {
    const q = search.toLowerCase();
    const matchSearch = c.code.toLowerCase().includes(q) || c.notes.toLowerCase().includes(q) || c.campaign.toLowerCase().includes(q);
    const matchFilter = filter === "All" || c.type === filter || (filter === "Active" && c.active) || (filter === "Inactive" && !c.active);
    return matchSearch && matchFilter;
  });

  function openNew() { setEditing(null); setForm({ code:"", type:"Discount", tier:"Any", discountType:"% off", value:"", duration:"One-time", singleUse:false, onePerEmail:true, maxUses:"", starts:"", expires:"", campaign:"", notes:"", promoMsg:"", bulkCount:"" }); setShowModal(true); }
  function openEdit(c, e) { e.stopPropagation(); setEditing(c.id); setForm({ code:c.code, type:c.type, tier:c.tier, discountType:c.discountType, value:c.value, duration:c.duration, singleUse:c.singleUse, onePerEmail:c.onePerEmail, maxUses:c.maxUses||"", starts:c.starts||"", expires:c.expires||"", campaign:c.campaign||"", notes:c.notes||"", promoMsg:c.promoMsg||"", bulkCount:"" }); setShowModal(true); }

  function saveCode() {
    if (!form.code.trim()) return;
    if (editing) {
      setCodes(p => p.map(c => c.id === editing ? { ...c, ...form, maxUses: form.maxUses ? parseInt(form.maxUses) : null } : c));
    } else if (form.bulkCount && parseInt(form.bulkCount) > 1) {
      const newCodes = Array.from({ length: parseInt(form.bulkCount) }, (_, i) => ({ id: Date.now()+i, ...form, code: form.code+"-"+String(i+1).padStart(3,"0"), uses:0, active:true, assigned:[], maxUses:1, singleUse:true }));
      setCodes(p => [...p, ...newCodes]);
    } else {
      setCodes(p => [...p, { id: Date.now(), ...form, uses:0, active:true, assigned:[], maxUses: form.maxUses ? parseInt(form.maxUses) : null }]);
    }
    setShowModal(false);
  }

  function generateCode() { const chars="ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"; setForm(f=>({...f,code:Array.from({length:8},()=>chars[Math.floor(Math.random()*chars.length)]).join("")})); }
  function toggleActive(id, e) { e.stopPropagation(); setCodes(p => p.map(c => c.id === id ? { ...c, active: !c.active } : c)); }
  function deleteCode(id, e) { e.stopPropagation(); if (window.confirm("Delete this code?")) setCodes(p => p.filter(c => c.id !== id)); }
  function updateCode(updated) { setCodes(p => p.map(c => c.id === updated.id ? updated : c)); setSelectedCode(updated); }
  function exportCSV() {
    const headers = ["Code","Type","Tier","Discount","Value","Uses","Max Uses","Active","Expires","Campaign","Notes"];
    const rows = codes.map(c => [c.code,c.type,c.tier,c.discountType,c.value,c.uses,c.maxUses||"Unlimited",c.active?"Yes":"No",c.expires||"No expiry",c.campaign,c.notes]);
    const csv = [headers,...rows].map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\n");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv],{type:"text/csv"})); a.download="sidekix-promo-codes.csv"; a.click();
  }

  if (selectedCode) {
    const fresh = codes.find(c => c.id === selectedCode.id) || selectedCode;
    return <PromoCodeDetail code={fresh} onBack={() => setSelectedCode(null)} onUpdate={updateCode} />;
  }

  const totalUses   = codes.reduce((a,c) => a+c.uses, 0);
  const activeCodes = codes.filter(c => c.active).length;
  const campaigns   = [...new Set(codes.map(c=>c.campaign).filter(Boolean))].length;
  const presaleUses = codes.filter(c=>c.type==="Presale").reduce((a,c)=>a+c.uses,0);

  return (
    <div style={{ padding: isMobile ? "16px" : "28px 40px", maxWidth:1200, margin:"0 auto" }}>
      <div style={{ display:"flex", alignItems:"flex-start", justifyContent:"space-between", marginBottom:24 }}>
        <div>
          <div style={{ fontFamily:serif, fontSize:26, fontWeight:300, color:GOLD, letterSpacing:"0.02em" }}>Promo Codes</div>
          <div style={{ fontSize:13, color:TEXT_MUTED, marginTop:4 }}>Manage discount, trial, referral, and presale codes</div>
        </div>
        <div style={{ display:"flex", gap:10 }}>
          <button onClick={exportCSV} style={{ padding:"8px 14px", background:"none", border:"1px solid "+BORDER, borderRadius:6, color:TEXT_SECONDARY, fontSize:12, cursor:"pointer" }}>Export CSV</button>
          <button onClick={openNew} style={{ padding:"8px 18px", background:GOLD, border:"none", borderRadius:6, color:DARK_BG, fontSize:13, fontWeight:600, cursor:"pointer" }}>+ New Code</button>
        </div>
      </div>

      <div style={{ display:"grid", gridTemplateColumns: isMobile ? "repeat(2,1fr)" : "repeat(5,1fr)", gap: isMobile ? 10 : 14, marginBottom: isMobile ? 16 : 24 }}>
        {[{label:"Total codes",value:codes.length},{label:"Active",value:activeCodes},{label:"Total uses",value:totalUses},{label:"Campaigns",value:campaigns},{label:"Presale uses",value:presaleUses}].map(s => (
          <div key={s.label} style={{ background:DARK_CARD, border:"1px solid "+BORDER, borderRadius:8, padding:"14px 18px" }}>
            <div style={{ fontSize:22, fontWeight:600, color:GOLD, fontFamily:mono }}>{s.value}</div>
            <div style={{ fontSize:12, color:TEXT_MUTED, marginTop:4 }}>{s.label}</div>
          </div>
        ))}
      </div>

      <div style={{ display:"flex", gap:10, marginBottom:16, alignItems:"center", flexWrap:"wrap" }}>
        <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Search codes, campaigns, notes…"
          style={{ flex:1, minWidth:160, padding:"8px 14px", background:DARK_CARD, border:"1px solid "+BORDER, borderRadius:6, color:TEXT_PRIMARY, fontSize:13, outline:"none" }} />
        {["All","Active","Inactive","Discount","Trial","Referral","Presale"].map(f => (
          <button key={f} onClick={() => setFilter(f)} style={{ padding:"6px 14px", background: filter===f ? GOLD : "none", border:"1px solid "+(filter===f ? GOLD : BORDER), borderRadius:20, color: filter===f ? DARK_BG : TEXT_SECONDARY, fontSize:12, cursor:"pointer", fontWeight: filter===f ? 600 : 400 }}>{f}</button>
        ))}
      </div>

      <div style={{ background:DARK_CARD, border:"1px solid "+BORDER, borderRadius:8, overflowX: isMobile ? "auto" : "hidden" }}>
        <table style={{ width:"100%", minWidth: isMobile ? 700 : "auto", borderCollapse:"collapse", tableLayout:"fixed" }}>
          <thead>
            <tr style={{ borderBottom:"1px solid "+BORDER }}>
              {[["Code","17%"],["Type","9%"],["Unlocks","8%"],["Value","8%"],["Uses","11%"],["Link","14%"],["Expires","9%"],["Campaign","8%"],["Status","8%"],["","8%"]].map(([h,w]) => (
                <th key={h} style={{ padding:"10px 12px", textAlign:"left", fontSize:10, fontWeight:600, color:TEXT_MUTED, letterSpacing:"0.06em", textTransform:"uppercase", width:w, overflow:"hidden" }}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {filtered.map((c, i) => {
              const tc = CODE_TYPE_COLORS[c.type] || CODE_TYPE_COLORS.Discount;
              const progress = c.maxUses ? Math.round((c.uses/c.maxUses)*100) : null;
              return (
                <tr key={c.id} onClick={() => setSelectedCode(c)}
                  style={{ borderBottom: i<filtered.length-1 ? "1px solid "+BORDER : "none", cursor:"pointer" }}
                  onMouseEnter={e => e.currentTarget.style.background="rgba(201,169,110,0.04)"}
                  onMouseLeave={e => e.currentTarget.style.background="transparent"}>
                  <td style={{ padding:"11px 12px", overflow:"hidden" }}>
                    <div style={{ fontFamily:mono, fontSize:13, fontWeight:600, color:GOLD, letterSpacing:"0.04em", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{c.code}</div>
                    {c.notes && <div style={{ fontSize:10, color:TEXT_MUTED, marginTop:2, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{c.notes}</div>}
                  </td>
                  <td style={{ padding:"11px 12px" }}>
                    <span style={{ background:tc.bg, color:tc.color, border:"1px solid "+tc.border, borderRadius:4, padding:"2px 8px", fontSize:10, fontWeight:600, whiteSpace:"nowrap" }}>{c.type}</span>
                  </td>
                  <td style={{ padding:"11px 12px", fontSize:11, color:TEXT_SECONDARY, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{c.tier}</td>
                  <td style={{ padding:"11px 12px", fontFamily:mono, fontSize:11, color:TEXT_PRIMARY, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{c.discountType === "% off" ? c.value+"%" : c.discountType === "$ off" ? "$"+c.value : c.value}</td>
                  <td style={{ padding:"11px 12px" }}>
                    <div style={{ fontSize:11, color:TEXT_PRIMARY }}>{c.uses}{c.maxUses ? " / "+c.maxUses : ""}</div>
                    {progress !== null && <div style={{ marginTop:3, height:3, background:BORDER, borderRadius:2, width:60 }}><div style={{ height:3, background:GOLD, borderRadius:2, width:progress+"%" }} /></div>}
                  </td>
                  <td style={{ padding:"11px 12px" }}>
                    <div style={{ display:"flex", alignItems:"center", gap:5 }}>
                      <span style={{ fontFamily:mono, fontSize:10, color:GOLD, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap", flex:1 }}>…/join?code={c.code}</span>
                      <button onClick={e => { e.stopPropagation(); navigator.clipboard?.writeText("https://sidekixhq.com/join?code="+c.code); }} aria-label="Copy link" title="Copy link" style={{ background:"none", border:"none", color:TEXT_MUTED, cursor:"pointer", fontSize:12, padding:"2px 4px", flexShrink:0 }}>⎘</button>
                    </div>
                  </td>
                  <td style={{ padding:"11px 12px", fontSize:11, color:TEXT_SECONDARY, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{c.expires || "No expiry"}</td>
                  <td style={{ padding:"11px 12px", fontSize:11, color:TEXT_SECONDARY, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{c.campaign || "—"}</td>
                  <td style={{ padding:"11px 12px" }}>
                    <button onClick={e => toggleActive(c.id,e)} style={{ background: c.active ? "rgba(100,200,100,0.1)" : "rgba(100,100,100,0.1)", border:"1px solid "+(c.active ? "rgba(100,200,100,0.3)" : BORDER), borderRadius:4, padding:"2px 8px", fontSize:10, fontWeight:600, color: c.active ? "#7EC87E" : TEXT_MUTED, cursor:"pointer", whiteSpace:"nowrap" }}>
                      {c.active ? "Active" : "Paused"}
                    </button>
                  </td>
                  <td style={{ padding:"11px 12px" }}>
                    <RowMenu archived={false} onArchive={()=>{}} onRestore={()=>{}} onDelete={e => deleteCode(c.id,e)} onUnsubscribe={null}
                      extraActions={[{ label:"Edit", onClick: e => openEdit(c,e) }]} />
                  </td>
                </tr>
              );
            })}
            {filtered.length === 0 && <tr><td colSpan={10} style={{ padding:"40px", textAlign:"center", color:TEXT_MUTED, fontSize:13 }}>No codes found</td></tr>}
          </tbody>
        </table>
      </div>

      {showModal && (
        <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.75)", zIndex:1000, display:"flex", alignItems:"center", justifyContent:"center" }} onClick={() => setShowModal(false)}>
          <div style={{ background:DARK_CARD, border:"1px solid "+BORDER, borderRadius:12, padding:28, width:560, maxWidth:"90vw", maxHeight:"90vh", overflowY:"auto" }} onClick={e => e.stopPropagation()}>
            <div style={{ fontFamily:serif, fontSize:20, fontWeight:300, color:GOLD, marginBottom:6 }}>{editing ? "Edit Code" : "New Promo Code"}</div>
            <div style={{ fontSize:12, color:TEXT_MUTED, marginBottom:20 }}>Configure how this code behaves and what it unlocks</div>

            <div style={{ fontSize:10, fontWeight:600, color:TEXT_MUTED, textTransform:"uppercase", letterSpacing:"0.06em", marginBottom:10, paddingBottom:6, borderBottom:"1px solid "+BORDER }}>Code basics</div>
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:14, marginBottom:14 }}>
              <div>
                <div style={{ fontSize:11, color:TEXT_MUTED, marginBottom:5 }}>Code *</div>
                <div style={{ display:"flex", gap:8 }}>
                  <input value={form.code} onChange={e => setForm(f=>({...f,code:e.target.value.toUpperCase()}))}
                    style={{ flex:1, padding:"7px 10px", background:DARK_BG, border:"1px solid "+BORDER, borderRadius:6, color:TEXT_PRIMARY, fontSize:13, fontFamily:mono, outline:"none" }} placeholder="LAUNCH20" />
                  <button onClick={generateCode} style={{ padding:"7px 12px", background:"none", border:"1px solid "+BORDER, borderRadius:6, color:TEXT_MUTED, fontSize:11, cursor:"pointer" }}>⚡ Gen</button>
                </div>
              </div>
              <div>
                <div style={{ fontSize:11, color:TEXT_MUTED, marginBottom:5 }}>Type</div>
                <select value={form.type} onChange={e => setForm(f=>({...f,type:e.target.value}))}
                  style={{ width:"100%", padding:"7px 10px", background:DARK_BG, border:"1px solid "+BORDER, borderRadius:6, color:TEXT_PRIMARY, fontSize:13, outline:"none" }}>
                  <option>Discount</option><option>Trial</option><option>Referral</option><option>Presale</option>
                </select>
              </div>
            </div>
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:14, marginBottom:20 }}>
              <div><div style={{ fontSize:11, color:TEXT_MUTED, marginBottom:5 }}>Campaign</div><input value={form.campaign} onChange={e => setForm(f=>({...f,campaign:e.target.value}))} style={{ width:"100%", padding:"7px 10px", background:DARK_BG, border:"1px solid "+BORDER, borderRadius:6, color:TEXT_PRIMARY, fontSize:13, outline:"none" }} placeholder="Launch, Waitlist…" /></div>
              <div><div style={{ fontSize:11, color:TEXT_MUTED, marginBottom:5 }}>Notes</div><input value={form.notes} onChange={e => setForm(f=>({...f,notes:e.target.value}))} style={{ width:"100%", padding:"7px 10px", background:DARK_BG, border:"1px solid "+BORDER, borderRadius:6, color:TEXT_PRIMARY, fontSize:13, outline:"none" }} placeholder="Internal note" /></div>
            </div>

            <div style={{ fontSize:10, fontWeight:600, color:TEXT_MUTED, textTransform:"uppercase", letterSpacing:"0.06em", marginBottom:10, paddingBottom:6, borderBottom:"1px solid "+BORDER }}>What it unlocks</div>
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:14, marginBottom:14 }}>
              <div><div style={{ fontSize:11, color:TEXT_MUTED, marginBottom:5 }}>Applies to</div><select value={form.tier} onChange={e => setForm(f=>({...f,tier:e.target.value}))} style={{ width:"100%", padding:"7px 10px", background:DARK_BG, border:"1px solid "+BORDER, borderRadius:6, color:TEXT_PRIMARY, fontSize:13, outline:"none" }}><option>Any tier</option><option>Access</option><option>Core</option><option>Premium</option></select></div>
              <div><div style={{ fontSize:11, color:TEXT_MUTED, marginBottom:5 }}>Discount type</div><select value={form.discountType} onChange={e => setForm(f=>({...f,discountType:e.target.value}))} style={{ width:"100%", padding:"7px 10px", background:DARK_BG, border:"1px solid "+BORDER, borderRadius:6, color:TEXT_PRIMARY, fontSize:13, outline:"none" }}><option>% off</option><option>$ off</option><option>Free trial</option><option>Free month</option></select></div>
              <div><div style={{ fontSize:11, color:TEXT_MUTED, marginBottom:5 }}>Value</div><input value={form.value} onChange={e => setForm(f=>({...f,value:e.target.value}))} style={{ width:"100%", padding:"7px 10px", background:DARK_BG, border:"1px solid "+BORDER, borderRadius:6, color:TEXT_PRIMARY, fontSize:13, outline:"none" }} placeholder="20 or 30 days" /></div>
            </div>
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:14, marginBottom:20 }}>
              <div><div style={{ fontSize:11, color:TEXT_MUTED, marginBottom:5 }}>Duration</div><select value={form.duration} onChange={e => setForm(f=>({...f,duration:e.target.value}))} style={{ width:"100%", padding:"7px 10px", background:DARK_BG, border:"1px solid "+BORDER, borderRadius:6, color:TEXT_PRIMARY, fontSize:13, outline:"none" }}><option>One-time</option><option>3 months</option><option>6 months</option><option>Forever</option></select></div>
              <div><div style={{ fontSize:11, color:TEXT_MUTED, marginBottom:5 }}>Promo message</div><input value={form.promoMsg} onChange={e => setForm(f=>({...f,promoMsg:e.target.value}))} style={{ width:"100%", padding:"7px 10px", background:DARK_BG, border:"1px solid "+BORDER, borderRadius:6, color:TEXT_PRIMARY, fontSize:13, outline:"none" }} placeholder="You locked in founder pricing!" /></div>
            </div>

            <div style={{ fontSize:10, fontWeight:600, color:TEXT_MUTED, textTransform:"uppercase", letterSpacing:"0.06em", marginBottom:10, paddingBottom:6, borderBottom:"1px solid "+BORDER }}>Usage limits</div>
            {[{key:"singleUse",label:"Single use",desc:"Each code can only be redeemed once"},{key:"onePerEmail",label:"One per email",desc:"Prevent same email redeeming multiple times"}].map(t => (
              <div key={t.key} style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"10px 12px", background:DARK_BG, borderRadius:6, marginBottom:8 }}>
                <div><div style={{ fontSize:13, color:TEXT_PRIMARY }}>{t.label}</div><div style={{ fontSize:11, color:TEXT_MUTED, marginTop:2 }}>{t.desc}</div></div>
                <button onClick={() => setForm(f=>({...f,[t.key]:!f[t.key]}))} style={{ width:36, height:20, borderRadius:10, background: form[t.key] ? GOLD : BORDER, border:"none", cursor:"pointer", position:"relative", flexShrink:0 }}>
                  <span style={{ position:"absolute", width:14, height:14, background:"white", borderRadius:"50%", top:3, left: form[t.key] ? 19 : 3, transition:"left 0.15s" }} />
                </button>
              </div>
            ))}
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:14, marginTop:10, marginBottom:20 }}>
              <div><div style={{ fontSize:11, color:TEXT_MUTED, marginBottom:5 }}>Max total uses</div><input value={form.maxUses} onChange={e => setForm(f=>({...f,maxUses:e.target.value}))} type="number" style={{ width:"100%", padding:"7px 10px", background:DARK_BG, border:"1px solid "+BORDER, borderRadius:6, color:TEXT_PRIMARY, fontSize:13, outline:"none" }} placeholder="Unlimited" /></div>
              <div><div style={{ fontSize:11, color:TEXT_MUTED, marginBottom:5 }}>Start date</div><input value={form.starts} onChange={e => setForm(f=>({...f,starts:e.target.value}))} type="date" style={{ width:"100%", padding:"7px 10px", background:DARK_BG, border:"1px solid "+BORDER, borderRadius:6, color:TEXT_PRIMARY, fontSize:13, outline:"none" }} /></div>
              <div><div style={{ fontSize:11, color:TEXT_MUTED, marginBottom:5 }}>End date</div><input value={form.expires} onChange={e => setForm(f=>({...f,expires:e.target.value}))} type="date" style={{ width:"100%", padding:"7px 10px", background:DARK_BG, border:"1px solid "+BORDER, borderRadius:6, color:TEXT_PRIMARY, fontSize:13, outline:"none" }} /></div>
            </div>

            {!editing && (
              <>
                <div style={{ fontSize:10, fontWeight:600, color:TEXT_MUTED, textTransform:"uppercase", letterSpacing:"0.06em", marginBottom:10, paddingBottom:6, borderBottom:"1px solid "+BORDER }}>Bulk generate</div>
                <div style={{ display:"flex", alignItems:"center", gap:12, padding:"10px 12px", background:DARK_BG, borderRadius:6, marginBottom:20 }}>
                  <div style={{ flex:1, fontSize:13, color:TEXT_SECONDARY }}>Generate unique single-use codes</div>
                  <input value={form.bulkCount} onChange={e => setForm(f=>({...f,bulkCount:e.target.value}))} type="number" min="1" max="500"
                    style={{ width:60, padding:"6px 8px", background:DARK_CARD, border:"1px solid "+BORDER, borderRadius:6, color:TEXT_PRIMARY, fontSize:13, outline:"none", textAlign:"center" }} placeholder="1" />
                </div>
              </>
            )}

            <div style={{ display:"flex", gap:10, justifyContent:"flex-end", paddingTop:16, borderTop:"1px solid "+BORDER }}>
              <button onClick={() => setShowModal(false)} style={{ padding:"8px 20px", background:"none", border:"1px solid "+BORDER, borderRadius:6, color:TEXT_SECONDARY, fontSize:13, cursor:"pointer" }}>Cancel</button>
              <button onClick={saveCode} style={{ padding:"8px 20px", background:GOLD, border:"none", borderRadius:6, color:DARK_BG, fontSize:13, fontWeight:600, cursor:"pointer" }}>{editing ? "Save Changes" : form.bulkCount > 1 ? "Generate "+form.bulkCount+" Codes" : "Create Code"}</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}


function SettingsTab() {
  const width = useWindowWidth();
  const isMobile = width < 768;
  const [saved, setSaved]     = useState(false);
  const [testing, setTesting] = useState(false);
  const [serverStatus, setServerStatus] = useState(null);

  async function testConnection() {
    setTesting(true);
    setServerStatus(null);
    try {
      const r = await fetch(SERVER_URL);
      const d = await r.json();
      setServerStatus(d.status ? "online" : "error");
    } catch(e) {
      setServerStatus("offline");
    }
    setTesting(false);
  }

  return (
    <div style={{ padding: isMobile ? "16px" : "32px 40px", maxWidth:640 }}>
      <div style={{ fontFamily:serif, fontSize:26, fontWeight:300, color:GOLD, letterSpacing:"0.02em", marginBottom:28 }}>Settings</div>

      {/* Server status */}
      <div style={{ background:DARK_CARD, border:"1px solid "+BORDER, borderRadius:8, padding:20, marginBottom:20 }}>
        <div style={{ fontSize:11, fontWeight:600, color:TEXT_MUTED, textTransform:"uppercase", letterSpacing:"0.06em", marginBottom:14 }}>System status</div>
        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:12 }}>
          <div>
            <div style={{ fontSize:13, color:TEXT_PRIMARY, fontWeight:500 }}>Email server</div>
            <div style={{ fontSize:11, color:TEXT_MUTED, fontFamily:mono, marginTop:2 }}>{SERVER_URL}</div>
          </div>
          <div style={{ display:"flex", alignItems:"center", gap:10 }}>
            {serverStatus && (
              <span style={{ fontSize:12, color: serverStatus==="online" ? "#7EC87E" : "#E07070", display:"flex", alignItems:"center", gap:4 }}>
                <span style={{ width:7, height:7, borderRadius:"50%", background: serverStatus==="online" ? "#7EC87E" : "#E07070", display:"inline-block" }}></span>
                {serverStatus === "online" ? "Online" : "Offline"}
              </span>
            )}
            <button onClick={testConnection} disabled={testing}
              style={{ padding:"6px 14px", background:"none", border:"1px solid "+BORDER, borderRadius:6, color:TEXT_SECONDARY, fontSize:12, cursor:"pointer" }}>
              {testing ? "Testing…" : "Test connection"}
            </button>
          </div>
        </div>
        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between" }}>
          <div>
            <div style={{ fontSize:13, color:TEXT_PRIMARY, fontWeight:500 }}>Make webhook</div>
            <div style={{ fontSize:11, color:TEXT_MUTED, fontFamily:mono, marginTop:2 }}>hook.us2.make.com/2f7zckyzjj…</div>
          </div>
          <span style={{ fontSize:12, color:TEXT_MUTED }}>Connected</span>
        </div>
      </div>

      {/* Sender addresses */}
      <div style={{ background:DARK_CARD, border:"1px solid "+BORDER, borderRadius:8, padding:20, marginBottom:20 }}>
        <div style={{ fontSize:11, fontWeight:600, color:TEXT_MUTED, textTransform:"uppercase", letterSpacing:"0.06em", marginBottom:14 }}>Sender addresses</div>
        {[
          { label:"Member emails", addr:"joinus@sidekixhq.com",     desc:"Subscribers, waitlist, contact, follow-ups" },
          { label:"Advisor emails", addr:"Advisors@sidekixhq.com",   desc:"Applications, offers, interviews, rejections" },
        ].map(s => (
          <div key={s.addr} style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"10px 0", borderBottom:"1px solid "+BORDER }}>
            <div>
              <div style={{ fontSize:13, color:TEXT_PRIMARY, fontWeight:500 }}>{s.label}</div>
              <div style={{ fontSize:11, fontFamily:mono, color:GOLD, marginTop:2 }}>{s.addr}</div>
              <div style={{ fontSize:11, color:TEXT_MUTED, marginTop:2 }}>{s.desc}</div>
            </div>
            <span style={{ fontSize:11, color:"#7EC87E", display:"flex", alignItems:"center", gap:4 }}>
              <span style={{ width:7, height:7, borderRadius:"50%", background:"#7EC87E", display:"inline-block" }}></span>
              Verified
            </span>
          </div>
        ))}
      </div>

      {/* Portal access */}
      <div style={{ background:DARK_CARD, border:"1px solid "+BORDER, borderRadius:8, padding:20 }}>
        <div style={{ fontSize:11, fontWeight:600, color:TEXT_MUTED, textTransform:"uppercase", letterSpacing:"0.06em", marginBottom:14 }}>Portal access</div>
        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:10 }}>
          <div>
            <div style={{ fontSize:13, color:TEXT_PRIMARY, fontWeight:500 }}>Portal URL</div>
            <div style={{ fontSize:11, fontFamily:mono, color:GOLD, marginTop:2 }}>sidekixhq.github.io/sidekix-portal</div>
          </div>
        </div>
        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between" }}>
          <div>
            <div style={{ fontSize:13, color:TEXT_PRIMARY, fontWeight:500 }}>Document center</div>
            <div style={{ fontSize:11, fontFamily:mono, color:GOLD, marginTop:2 }}>sidekixhq.github.io/sidekix-docs</div>
          </div>
          <a href="https://sidekixhq.github.io/sidekix-docs/" target="_blank"
            style={{ fontSize:11, color:TEXT_MUTED, textDecoration:"none", border:"1px solid "+BORDER, borderRadius:4, padding:"4px 10px" }}>
            Open ↗
          </a>
        </div>
      </div>
    </div>
  );
}

// ─── Dashboard ────────────────────────────────────────────────────────────────
function Dashboard({ currentUser, onSignOut }) {
  const [tab, setTab]       = useState("subscribers");
  const [theme, setTheme]   = useState(() => {
    try { return localStorage.getItem("sidekix-theme") || "dark"; } catch(e) { return "dark"; }
  });
  useEffect(() => {
    try { localStorage.setItem("sidekix-theme", theme); } catch(e) {}
  }, [theme]);
  const [promoCodes, setPromoCodes] = useState(INITIAL_CODES);
  const [mobileNavOpen, setMobileNavOpen] = useState(false);
  const width = useWindowWidth();
  const isMobile = width < 768;

  // Apply theme tokens globally before each render
  const t = THEMES[theme];
  GOLD           = t.GOLD;
  GOLD_LIGHT     = t.GOLD_LIGHT;
  DARK_BG        = t.DARK_BG;
  DARK_CARD      = t.DARK_CARD;
  DARK_CARD2     = t.DARK_CARD2;
  BORDER         = t.BORDER;
  TEXT_PRIMARY   = t.TEXT_PRIMARY;
  TEXT_SECONDARY = t.TEXT_SECONDARY;
  TEXT_MUTED     = t.TEXT_MUTED;

  const TABS = [
    { id:"templates",   label:"Templates"   },
    { id:"subscribers", label:"Subscribers" },
    { id:"promocodes",  label:"Promo Codes" },
    { id:"docs",        label:"Documents"   },
    { id:"sendlog",     label:"Send Log"    },
    { id:"settings",    label:"Settings"    },
  ];

  return (
    <ToastProvider>
    <div style={{ minHeight:"100vh", background:DARK_BG, color:TEXT_PRIMARY, fontFamily:font }} key={theme}>
      {/* Nav */}
      <div style={{ borderBottom:"1px solid "+BORDER, padding: isMobile ? "0 16px" : "0 40px", display:"flex", alignItems:"center", justifyContent:"space-between", background:DARK_CARD, position:"sticky", top:0, zIndex:100 }}>
        <div style={{ display:"flex", alignItems:"center", gap: isMobile ? 0 : 32, flex:1 }}>
          <div style={{ fontFamily:serif, fontSize: isMobile ? 18 : 22, fontWeight:300, color:GOLD, padding:"14px 0", letterSpacing:"0.04em", flexShrink:0 }}>
            SideKix{!isMobile && <span style={{ fontSize:10, color:TEXT_MUTED, fontFamily:font, fontWeight:400, marginLeft:6, letterSpacing:"0.1em", textTransform:"uppercase" }}>Team Portal</span>}
          </div>
          {!isMobile && (
            <nav style={{ display:"flex", gap:0 }}>
              {TABS.map(t => (
                <button key={t.id} onClick={() => setTab(t.id)}
                  style={{ padding:"16px 14px", background:"none", border:"none", borderBottom: tab===t.id ? "2px solid "+GOLD : "2px solid transparent", color: tab===t.id ? GOLD : TEXT_MUTED, fontSize:11, fontWeight: tab===t.id ? 600 : 400, cursor:"pointer", fontFamily:font, letterSpacing:"0.08em", textTransform:"uppercase", whiteSpace:"nowrap" }}>
                  {t.label}
                </button>
              ))}
            </nav>
          )}
        </div>
        <div style={{ display:"flex", alignItems:"center", gap:10 }}>
          <button onClick={() => setTheme(t => t === "dark" ? "light" : "dark")}
            aria-label={theme === "dark" ? "Switch to light mode" : "Switch to dark mode"}
            title={theme === "dark" ? "Switch to light mode" : "Switch to dark mode"}
            style={{ fontSize:16, padding:"6px 10px", background:"none", border:"1px solid "+BORDER, borderRadius:4, color:TEXT_MUTED, cursor:"pointer", lineHeight:1 }}>
            {theme === "dark" ? "☀" : "☾"}
          </button>
          {!isMobile && <span style={{ fontSize:12, color:TEXT_MUTED, fontFamily:mono }}>{currentUser}</span>}
          {!isMobile && <button onClick={onSignOut} style={{ fontSize:11, padding:"6px 14px", background:"none", border:"1px solid "+BORDER, borderRadius:4, color:TEXT_MUTED, cursor:"pointer", fontFamily:font, letterSpacing:"0.06em", textTransform:"uppercase" }}>Sign Out</button>}
          {isMobile && (
            <button onClick={() => setMobileNavOpen(o => !o)}
              style={{ background:"none", border:"1px solid "+BORDER, borderRadius:4, padding:"6px 10px", color:TEXT_MUTED, cursor:"pointer", fontSize:18, lineHeight:1 }}>
              ☰
            </button>
          )}
        </div>
      </div>

      {/* Mobile nav drawer */}
      {isMobile && mobileNavOpen && (
        <div style={{ background:DARK_CARD, borderBottom:"1px solid "+BORDER, padding:"8px 0" }}>
          {TABS.map(t => (
            <button key={t.id} onClick={() => { setTab(t.id); setMobileNavOpen(false); }}
              style={{ display:"block", width:"100%", padding:"12px 20px", background: tab===t.id ? "rgba(201,169,110,0.1)" : "none", border:"none", borderLeft: tab===t.id ? "3px solid "+GOLD : "3px solid transparent", color: tab===t.id ? GOLD : TEXT_SECONDARY, fontSize:13, fontWeight: tab===t.id ? 600 : 400, cursor:"pointer", fontFamily:font, textAlign:"left" }}>
              {t.label}
            </button>
          ))}
          <div style={{ padding:"12px 20px", borderTop:"1px solid "+BORDER, display:"flex", justifyContent:"space-between", alignItems:"center" }}>
            <span style={{ fontSize:11, color:TEXT_MUTED, fontFamily:mono }}>{currentUser}</span>
            <button onClick={onSignOut} style={{ fontSize:11, padding:"6px 14px", background:"none", border:"1px solid "+BORDER, borderRadius:4, color:TEXT_MUTED, cursor:"pointer" }}>Sign Out</button>
          </div>
        </div>
      )}

      {/* Content */}
      <div>
        {tab === "templates"   && <TemplatesTab />}
        {tab === "subscribers" && <SubscribersTab currentUser={currentUser} promoCodes={promoCodes} setPromoCodes={setPromoCodes} />}
        {tab === "promocodes"  && <PromoCodesTab codes={promoCodes} setCodes={setPromoCodes} />}
        {tab === "docs"        && <DocsTab />}
        {tab === "sendlog"     && <SendLogTab />}
        {tab === "settings"    && <SettingsTab />}
      </div>
    </div>
    </ToastProvider>
  );
}




// ─── App root — hooks before conditional return ───────────────────────────────
function App() {
  const [currentUser, setCurrentUser] = useState(null);
  if (!currentUser) return <LoginGate onAccess={setCurrentUser} />;
  return <Dashboard currentUser={currentUser} onSignOut={() => setCurrentUser(null)} />;
}


ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
  </script>
</body>
</html>
