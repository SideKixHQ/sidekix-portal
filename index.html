function useWindowWidth() {
  const [width, setWidth] = useState(typeof window !== "undefined" ? window.innerWidth : 1200);
  useEffect(() => {
    function handle() { setWidth(window.innerWidth); }
    window.addEventListener("resize", handle);
    return () => window.removeEventListener("resize", handle);
  }, []);
  return width;
}

const ToastContext = React.createContext(null);

function ToastProvider({ children }) {
  const [toasts, setToasts] = useState([]);
  function showToast(message, type) {
    const id = Date.now();
    const kind = type || "success";
    setToasts(prev => [...prev, { id, message, kind }]);
    setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3500);
  }
  return (
    <ToastContext.Provider value={showToast}>
      {children}
      <div style={{ position:"fixed", bottom:24, right:24, zIndex:9999, display:"flex", flexDirection:"column", gap:8, pointerEvents:"none" }}>
        {toasts.map(t => {
          const isSuccess = t.kind === "success";
          const isError   = t.kind === "error";
          const bg     = isSuccess ? "rgba(100,200,100,0.15)" : isError ? "rgba(220,100,100,0.15)" : "rgba(201,169,110,0.15)";
          const border = isSuccess ? "rgba(100,200,100,0.35)" : isError ? "rgba(220,100,100,0.35)" : "rgba(201,169,110,0.35)";
          const color  = isSuccess ? "#7EC87E"                : isError ? "#E07070"                : GOLD;
          const icon   = isSuccess ? "✓"                      : isError ? "✕"                      : "◆";
          return (
            <div key={t.id} style={{ background:DARK_CARD, border:"1px solid "+border, borderRadius:8, padding:"12px 18px", fontSize:13, color:color, fontFamily:font, display:"flex", alignItems:"center", gap:10, minWidth:260, maxWidth:380 }}>
              <span style={{ fontWeight:700 }}>{icon}</span>
              <span style={{ color:TEXT_PRIMARY }}>{t.message}</span>
            </div>
          );
        })}
      </div>
    </ToastContext.Provider>
  );
}

function useToast() { return React.useContext(ToastContext); }

function LoginGate({ onAccess }) {
  const [email, setEmail] = useState("");
  const [pass,  setPass]  = useState("");
  const [error, setError] = useState("");
  const [busy,  setBusy]  = useState(false);

  function attempt() {
    setError(""); setBusy(true);
    setTimeout(() => {
      const domain = email.trim().split("@")[1] || "";
      if (domain !== ALLOWED_DOMAIN) { setError("Access requires a @sidekixhq.com email."); setBusy(false); return; }
      if (pass !== ACCESS_PASSWORD)  { setError("Incorrect password."); setBusy(false); return; }
      onAccess(email.trim());
    }, 500);
  }

  return (
    <div style={{ background:DARK_BG, minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center", padding:"2rem" }}>
      <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
      <div style={{ width:"100%", maxWidth:380 }}>
        <div style={{ textAlign:"center", marginBottom:"2.5rem" }}>
          <div style={{ fontFamily:serif, fontSize:28, letterSpacing:"0.12em", color:TEXT_PRIMARY, marginBottom:6 }}>SideKix<span style={{ color:GOLD }}>·</span></div>
          <div style={{ fontFamily:font, fontSize:11, color:TEXT_MUTED, letterSpacing:"0.1em", textTransform:"uppercase" }}>Team Portal</div>
        </div>
        <div style={{ background:DARK_CARD, border:"1px solid "+BORDER, borderRadius:8, padding:"1.75rem" }}>
          <div style={{ fontSize:15, fontFamily:serif, color:TEXT_PRIMARY, marginBottom:"1.25rem", textAlign:"center" }}>Sign in to continue</div>
          <label style={lbl}>SideKix Email</label>
          <input type="email" value={email} onChange={e => setEmail(e.target.value)} onKeyDown={e => e.key === "Enter" && attempt()} placeholder="you@sidekixhq.com" style={inp({ marginBottom:10 })} />
          <label style={lbl}>Password</label>
          <input type="password" value={pass} onChange={e => setPass(e.target.value)} onKeyDown={e => e.key === "Enter" && attempt()} placeholder="••••••••" style={inp({ marginBottom: error ? 8 : 16 })} />
          {error && <div style={{ fontSize:12, color:"#E07070", fontFamily:font, marginBottom:12 }}>{error}</div>}
          <button onClick={attempt} disabled={busy} style={{ width:"100%", padding:11, fontSize:12, fontWeight:600, letterSpacing:"0.08em", textTransform:"uppercase", borderRadius:5, border:"none", background:busy ? BORDER : GOLD, color:"#1C1A14", cursor:busy ? "default" : "pointer", fontFamily:font }}>
            {busy ? "Checking…" : "Sign In"}
          </button>
        </div>
        <div style={{ textAlign:"center", marginTop:"1.25rem", fontSize:11, color:TEXT_MUTED, fontFamily:font }}>Access restricted to @sidekixhq.com</div>
      </div>
    </div>
  );
}

  const [htmlMode,  setHtmlMode]  = useState(false);
  const taRef = useRef(null);

  function startEdit()  { setDraftSubj(subject); setDraftBody(body); setEditing(true); }
  function cancelEdit() { setEditing(false); }
  function saveEdit()   { setSubject(draftSubj); setBody(draftBody); setEditing(false); }

    if (!el) { setDraftBody(b => b + " " + v); return; }

// ─── Assignee Input ───────────────────────────────────────────────────────────
function AssigneeInput({ assignedTo, onChange }) {
  const [input,       setInput]       = useState("");
  const [suggestions, setSuggestions] = useState([]);
  const [known,       setKnown]       = useState(["james@sidekixhq.com","sarah@sidekixhq.com","mike@sidekixhq.com"]);
  const ref = useRef(null);

  useEffect(() => {
    function handler(e) { if (ref.current && !ref.current.contains(e.target)) setSuggestions([]); }
    document.addEventListener("mousedown", handler);
    return () => document.removeEventListener("mousedown", handler);
  }, []);

  function handleInput(v) {
    setInput(v);
    if (!v.trim()) { setSuggestions([]); return; }
    setSuggestions(known.filter(e => e.toLowerCase().includes(v.toLowerCase()) && !assignedTo.includes(e)));
  }
  function addEmail(email) {
    const c = email.trim().toLowerCase();
    if (!c.includes("@")) return;
    if (!assignedTo.includes(c)) { setKnown(k => [...new Set([...k, c])]); onChange([...assignedTo, c]); }
    setInput(""); setSuggestions([]);
  }
  function removeEmail(email) { onChange(assignedTo.filter(e => e !== email)); }

  return (
    <div ref={ref}>
      <div style={{ display:"flex", flexWrap:"wrap", gap:5, marginBottom: assignedTo.length ? 8 : 0 }}>
        {assignedTo.map(e => (
          <div key={e} style={{ display:"flex", alignItems:"center", gap:4, padding:"3px 8px", borderRadius:3, background:"rgba(201,169,110,0.1)", border:"1px solid rgba(201,169,110,0.25)", fontSize:11, fontFamily:font, color:GOLD_LIGHT }}>
            {e}<button onClick={() => removeEmail(e)} style={{ background:"none", border:"none", color:TEXT_MUTED, cursor:"pointer", fontSize:13, padding:0, lineHeight:1, marginLeft:2 }}>×</button>
          </div>
        ))}
      </div>
      <div style={{ position:"relative" }}>
        <input value={input} onChange={e => handleInput(e.target.value)}
          onKeyDown={e => { if (e.key === "Enter" && input.trim()) { addEmail(input); e.preventDefault(); } }}
          placeholder="Type email + Enter to assign…" style={inp()} />
        {suggestions.length > 0 && (
          <div style={{ position:"absolute", top:"calc(100% + 4px)", left:0, right:0, background:DARK_CARD, border:"1px solid "+BORDER, borderRadius:4, zIndex:100, boxShadow:"0 4px 16px rgba(0,0,0,0.4)", overflow:"hidden" }}>
            {suggestions.map(s => (
              <div key={s} onClick={() => addEmail(s)}
                style={{ padding:"8px 12px", fontSize:12, fontFamily:font, color:TEXT_SECONDARY, cursor:"pointer", borderBottom:"1px solid "+BORDER }}
                onMouseEnter={e => e.currentTarget.style.background = DARK_CARD2}
                onMouseLeave={e => e.currentTarget.style.background = "transparent"}>
                {s}
              </div>
            ))}
          </div>
        )}
      </div>
      <div style={{ fontSize:10, color:TEXT_MUTED, fontFamily:font, marginTop:4 }}>Type a @sidekixhq.com email and press Enter. Previously tagged appear as suggestions.</div>
    </div>
  );
}

// ─── Application Modal ────────────────────────────────────────────────────────
function ApplicationModal({ person, onClose, onUpdate, onArchive, onDelete }) {
  const toast = useToast();
  const width = useWindowWidth();
  const isMobile = width < 768;
  const [notes,     setNotes]     = useState(person.notes || "");
  const [editNotes, setEditNotes] = useState(false);
  const [status,    setStatus]    = useState(person.status);
  const [review,    setReview]    = useState(person.reviewStatus || "Pending");
  const [assigned,  setAssigned]  = useState(person.assignedTo || []);
  const [activeTab, setActiveTab] = useState("application");
  const [showInv,   setShowInv]   = useState(false);
  const [sentInv,   setSentInv]   = useState(false);
  const [invSubj,   setInvSubj]   = useState(DEFAULT_INTERVIEW_SUBJECT);
  const [invBody,   setInvBody]   = useState(DEFAULT_INTERVIEW_BODY);
  const [showRej,   setShowRej]   = useState(false);
  const [sentRej,   setSentRej]   = useState(false);
  const [rejSubj,   setRejSubj]   = useState(DEFAULT_REJECTION_SUBJECT);
  const [rejBody,   setRejBody]   = useState(DEFAULT_REJECTION_BODY);
  const app  = person.application || person;
  const tabs = [{ id:"application", label:"Application" }, { id:"profile", label:"Profile" }, { id:"history", label:"Email History" }];

  function handleReview(s) {
    setReview(s); onUpdate(person.id, { reviewStatus: s });
    if (s === "Interview") setShowInv(true);
    if (s === "Rejected")  setShowRej(true);
    if (s === "Offer") {
      const email = person.email;
      const firstName = person.firstName || "";
      const confirmed = window.confirm(
        "Send onboarding documents to " + firstName + " (" + email + ")?" +
        "\n\nThis will send them a link to sign the Mutual NDA, Advisor Agreement, and review all 3 platform policies."
      );
      if (!confirmed) { setReview(review); return; }
      const tpl = INITIAL_TEMPLATES.offer;
      const subject = tpl.subject.replace(/\{\{first_name\}\}/g, firstName).replace(/\{\{email\}\}/g, email);
      const body    = tpl.body.replace(/\{\{first_name\}\}/g, firstName).replace(/\{\{email\}\}/g, email);
      fetch(SERVER_URL + "/send-email", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-SideKix-Secret": SERVER_SECRET },
        body: JSON.stringify({ to: email, from: tpl.routedTo, fromName: "SideKix Advisors", subject, body }),
      }).then(() => toast && toast("Onboarding documents sent to " + firstName, "success"))
        .catch(() => toast && toast("Failed to send offer email", "error"));
    }
  }

  useEffect(() => {
    function onKey(e) { if (e.key === "Escape") onClose(); }
    document.addEventListener("keydown", onKey);
    return () => document.removeEventListener("keydown", onKey);
  }, []);

  return (
    <div role="dialog" aria-modal="true" aria-label="Advisor application" style={{ position:"fixed", inset:0, zIndex:1000, background: isMobile ? DARK_BG : "rgba(0,0,0,0.75)", display:"flex", alignItems:"flex-start", justifyContent:"center", padding: isMobile ? 0 : "2rem", overflowY:"auto" }}
      onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div style={{ background:DARK_BG, border: isMobile ? "none" : "1px solid "+BORDER, borderRadius: isMobile ? 0 : 10, width:"100%", maxWidth: isMobile ? "100%" : 900, minHeight: isMobile ? "100vh" : "auto" }}>
        {/* Header */}
        <div style={{ padding:"1.5rem 2rem", borderBottom:"1px solid "+BORDER, display:"flex", justifyContent:"space-between", alignItems:"center" }}>
          <div style={{ display:"flex", gap:14, alignItems:"center" }}>
            <Avatar first={person.firstName} last={person.lastName} size={48} />
            <div>
              <div style={{ fontSize:24, fontFamily:serif, color:TEXT_PRIMARY, lineHeight:1.1 }}>{person.firstName} {person.lastName}</div>
              <div style={{ fontSize:12, fontFamily:mono, color:TEXT_SECONDARY, marginTop:3 }}>{person.email}</div>
            </div>
            <div style={{ display:"flex", gap:6, marginLeft:8, flexWrap:"wrap" }}>
              <SourceTag source={person.source} /><StatusTag status={status} /><ReviewTag status={review} />
            </div>
          </div>
          <div style={{ display:"flex", gap:8, alignItems:"center" }}>
            {onArchive && (
              <button onClick={() => { if (window.confirm("Archive " + person.firstName + " " + person.lastName + "? They'll be hidden from the default view but can be restored.")) { onArchive(person.id); onClose(); } }}
                style={{ fontSize:11, padding:"6px 12px", borderRadius:4, border:"1px solid "+BORDER, background:"transparent", color:TEXT_MUTED, cursor:"pointer", fontFamily:font, textTransform:"uppercase", letterSpacing:"0.05em" }}>
                Archive
              </button>
            )}
            {onDelete && (
              <button onClick={() => { if (window.confirm("Permanently delete " + person.firstName + " " + person.lastName + "? This cannot be undone.")) { onDelete(person.id); onClose(); } }}
                style={{ fontSize:11, padding:"6px 12px", borderRadius:4, border:"1px solid rgba(220,100,100,0.4)", background:"rgba(220,100,100,0.08)", color:"#E07070", cursor:"pointer", fontFamily:font, textTransform:"uppercase", letterSpacing:"0.05em" }}>

            <button onClick={onClose} style={{ fontSize:11, padding:"6px 14px", borderRadius:4, border:"1px solid "+BORDER, background:"transparent", color:TEXT_MUTED, cursor:"pointer", fontFamily:font, textTransform:"uppercase" }}>✕ Close</button>
          </div>

// ─── Row Menu (three-dot) ─────────────────────────────────────────────────────
function RowMenu({ archived, onArchive, onRestore, onDelete, onUnsubscribe, isUnsubscribed, extraActions }) {
  const [open, setOpen] = useState(false);
  const [menuPos, setMenuPos] = useState({ top:0, right:0 });
  const ref = useRef(null);
  const btnRef = useRef(null);
  useEffect(() => {
    function handler(e) { if (ref.current && !ref.current.contains(e.target)) setOpen(false); }
    document.addEventListener("mousedown", handler);
    return () => document.removeEventListener("mousedown", handler);
  }, []);
  function handleOpen() {
    if (btnRef.current) {
      const r = btnRef.current.getBoundingClientRect();
      setMenuPos({ top: r.bottom + 4, right: window.innerWidth - r.right });
    }
    setOpen(o => !o);
  }
  return (
    <div ref={ref} style={{ position:"relative" }} onClick={e => e.stopPropagation()}>
      <button ref={btnRef} onClick={handleOpen} style={{ background:"none", border:"none", color:TEXT_MUTED, cursor:"pointer", fontSize:16, padding:"2px 6px", borderRadius:3, lineHeight:1 }}>
        {"⋯"}
      </button>
      {open && (
        <div style={{ position:"fixed", right:menuPos.right, top:menuPos.top, background:DARK_CARD, border:"1px solid "+BORDER, borderRadius:4, zIndex:9999, boxShadow:"0 4px 16px rgba(0,0,0,0.5)", overflow:"hidden", minWidth:140 }}>
          {archived
            ? <div onClick={e => { setOpen(false); onRestore(e); }}
                style={{ padding:"9px 14px", fontSize:12, fontFamily:font, color:TEXT_SECONDARY, cursor:"pointer", borderBottom:"1px solid "+BORDER }}
                onMouseEnter={e => e.currentTarget.style.background=DARK_CARD2}
                onMouseLeave={e => e.currentTarget.style.background="transparent"}>
                Restore
              </div>
            : <div onClick={e => { setOpen(false); onArchive(e); }}
                style={{ padding:"9px 14px", fontSize:12, fontFamily:font, color:TEXT_SECONDARY, cursor:"pointer", borderBottom:"1px solid "+BORDER }}
                onMouseEnter={e => e.currentTarget.style.background=DARK_CARD2}
                onMouseLeave={e => e.currentTarget.style.background="transparent"}>
                Archive
              </div>
          }
          {extraActions && extraActions.map((a, i) => (
            <div key={i} onClick={e => { setOpen(false); a.onClick(e); }}
              style={{ padding:"9px 14px", fontSize:12, fontFamily:font, color:TEXT_SECONDARY, cursor:"pointer", borderBottom:"1px solid "+BORDER }}
              onMouseEnter={e => e.currentTarget.style.background=DARK_CARD2}
              onMouseLeave={e => e.currentTarget.style.background="transparent"}>
              {a.label}
            </div>
          ))}
          {onUnsubscribe && !isUnsubscribed && (
            <div onClick={e => { setOpen(false); onUnsubscribe(e); }}
              style={{ padding:"9px 14px", fontSize:12, fontFamily:font, color:"#E07070", cursor:"pointer", borderBottom:"1px solid "+BORDER }}
              onMouseEnter={e => e.currentTarget.style.background="rgba(220,100,100,0.08)"}
              onMouseLeave={e => e.currentTarget.style.background="transparent"}>
              Unsubscribe
            </div>
          )}
          <div onClick={e => { setOpen(false); onDelete(e); }}
            style={{ padding:"9px 14px", fontSize:12, fontFamily:font, color:"#E07070", cursor:"pointer" }}
            onMouseEnter={e => e.currentTarget.style.background="rgba(220,100,100,0.08)"}
            onMouseLeave={e => e.currentTarget.style.background="transparent"}>
            Delete
          </div>
        </div>
      )}
    </div>
  );
}

// ─── Subscribers Tab ──────────────────────────────────────────────────────────
function SubscribersTab({ currentUser, promoCodes, setPromoCodes }) {
  const width = useWindowWidth();
  const isMobile = width < 768;
  const [subs,         setSubs]         = useState([]);
  const [loadingContacts, setLoadingContacts] = useState(true);
  const [loadError,    setLoadError]    = useState(null);

  // Load real contacts from server on mount
  useEffect(() => {
    setLoadingContacts(true);
    fetch(SERVER_URL + "/contacts", {
      headers: { "X-SideKix-Secret": SERVER_SECRET }
    })
      .then(r => r.json())
      .then(data => {
        if (data.success && Array.isArray(data.contacts)) {
          // Normalize server fields to portal field names
          const normalized = data.contacts.map(c => ({
            id:           c.id,
            firstName:    c.first_name  || "",
            lastName:     c.last_name   || "",
            email:        c.email       || "",
            phone:        c.phone       || "",
            source:       sourceLabel(c.source || c.form_type || ""),
            status:       c.status === "active" ? "Active" : c.status === "unsubscribed" ? "Unsubscribed" : c.status === "bounced" ? "Bounced" : c.status || "Active",
            reviewStatus: c.review      || "",
            tags:         c.tags        || [],
            notes:        c.notes       || "",
            expertise:    c.expertise   || "",
            background:   c.background  || "",
            strengths:    c.strengths   || "",
            challenge:    c.challenge   || "",
            whySidekix:   c.why_sidekix || "",
            linkedin:     c.linkedin    || "",
            website:      c.website     || "",
            city:         c.city        || "",
            state:        c.state       || "",
            zip:          c.zip_code    || "",
            socialHandles:c.social_handles || "",
            languages:    c.languages   || "",
            resume:       c.resume_url  || "",
            resumeName:   c.resume_url ? c.resume_url.split("/").pop() : "",
            yearsOwner:   c.years_owner || "",
            businessTypes:c.business_types || "",
            prevAdvisor:  c.prev_advisor || "",
            archived:     c.archived    || false,
            joined:       c.created_at ? new Date(c.created_at).toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" }) : "",
          }));
          setSubs(normalized);
        } else {
          setLoadError("Could not load contacts.");
        }
      })
      .catch(() => setLoadError("Could not reach server. Check your connection."))
      .finally(() => setLoadingContacts(false));
  }, []);

  function sourceLabel(ft) {
    if (ft === "application") return "Application";
    if (ft === "subscriber")  return "Subscriber";
    if (ft === "waitlist")    return "Waitlist";
    if (ft === "contact")     return "Contact";
    return ft ? ft.charAt(0).toUpperCase() + ft.slice(1) : "Subscriber";
  }

  // Persist a change to a single contact on the server
  async function serverPatch(id, updates) {
    try {
      await fetch(SERVER_URL + "/contacts/" + id, {
        method: "PATCH",
        headers: { "Content-Type": "application/json", "X-SideKix-Secret": SERVER_SECRET },
        body: JSON.stringify(updates),
      });
    } catch(e) { console.warn("Server patch failed:", e); }
  }

  // Persist deletion of one or more contacts
  async function serverDelete(ids) {
    try {
      await fetch(SERVER_URL + "/contacts", {
        method: "DELETE",
        headers: { "Content-Type": "application/json", "X-SideKix-Secret": SERVER_SECRET },
        body: JSON.stringify({ ids }),
      });
    } catch(e) { console.warn("Server delete failed:", e); }
  }
  const [search,       setSearch]       = useState("");
  const [subsView,     setSubsView]     = useState("list");
  const [showPromoModal,  setShowPromoModal]  = useState(false);
  const [promoPickCode,   setPromoPickCode]   = useState("");
  const [promoSending,    setPromoSending]    = useState(false);
  const [promoSentMsg,    setPromoSentMsg]    = useState("");
  const [promoModalMode,  setPromoModalMode]  = useState("existing");
  const [newCodeForm,     setNewCodeForm]     = useState({ code:"", type:"Discount", tier:"Any tier", discountType:"% off", value:"", campaign:"", expires:"", singleUse:false, onePerEmail:true, maxUses:null, duration:"One-time", promoMsg:"", starts:"", notes:"", assigned:[] });
  const [sourceFilter, setSourceFilter] = useState("All sources");
  const [statusFilter, setStatusFilter] = useState("All statuses");
  const [reviewFilter, setReviewFilter] = useState("All reviews");
  const [sort,         setSort]         = useState("Newest first");
  const [selectedIds,  setSelectedIds]  = useState(new Set());
  const [activePerson, setActivePerson] = useState(null);
  const [showArchived, setShowArchived] = useState(false);
  const [confirmDelete, setConfirmDelete] = useState(null);

  function archivePerson(id) {
    setSubs(p => p.map(s => s.id === id ? Object.assign({}, s, { archived:true }) : s));
    serverPatch(id, { archived: true });
    if (activePerson && activePerson.id === id) setActivePerson(null);
  }
  async function unsubscribePerson(id, email) {
    try {
      await fetch(SERVER_URL + "/unsubscribe?email=" + encodeURIComponent(email));
    } catch(e) { console.warn("Server unsubscribe failed:", e); }
    setSubs(p => p.map(s => s.id === id ? Object.assign({}, s, { status:"Unsubscribed" }) : s));
    serverPatch(id, { status: "unsubscribed" });
    if (activePerson && activePerson.id === id) setActivePerson(prev => Object.assign({}, prev, { status:"Unsubscribed" }));
  }
  function archiveSelected() {
    const ids = [...selectedIds];
    ids.forEach(id => setSubs(p => p.map(s => s.id === id ? Object.assign({}, s, { archived:true }) : s)));
    fetch(SERVER_URL + "/contacts", {
      method: "PATCH",
      headers: { "Content-Type":"application/json", "X-SideKix-Secret": SERVER_SECRET },
      body: JSON.stringify({ ids, updates: { archived: true } }),
    }).catch(e => console.warn("Bulk archive failed:", e));
    setSelectedIds(new Set());
  }
  async function sendPromoToSelected() {
    if (promoModalMode === "existing" && !promoPickCode) return;
    if (promoModalMode === "create" && !newCodeForm.code) return;

    // If creating a new code, add it to promoCodes first
    let codeToSend = promoPickCode;
    if (promoModalMode === "create") {
      codeToSend = newCodeForm.code;
      const newCode = { id: Date.now(), ...newCodeForm, uses:0, active:true, maxUses: newCodeForm.maxUses || null };
      if (setPromoCodes) setPromoCodes(prev => [...prev, newCode]);
    }
    if (!codeToSend) return;
    setPromoSending(true);
    const selectedSubs = subs.filter(s => selectedIds.has(s.id));
    const today = new Date().toLocaleDateString("en-US", { month:"short", day:"numeric" });
    for (const sub of selectedSubs) {
      try {
        await fetch(SERVER_URL + "/send-email", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-SideKix-Secret": SERVER_SECRET },
          body: JSON.stringify({
            to: sub.email,
            from: "joinus@sidekixhq.com",
            fromName: "SideKix",
            subject: "Your exclusive SideKix promo code",
            body: "Hi " + sub.firstName + ",\n\nHere is your exclusive SideKix promo code:\n\n" + codeToSend + "\n\nUse it when you sign up at sidekixhq.com/join?code=" + codeToSend + "\n\nTalk soon,\nThe SideKix Team\n\n---\nUnsubscribe: https://sidekix-email-server.onrender.com/unsubscribe?email=" + sub.email + "\nSideKix - Character Limit LLC - Wilmington, NC",
          }),
        });
      } catch(e) { console.warn("Failed to send to", sub.email); }
    }
    // Track in promo code assigned list
    if (setPromoCodes) {
      setPromoCodes(prev => prev.map(c => {
        if (c.code !== codeToSend) return c;
        const existingEmails = new Set(c.assigned.map(a => a.email));
        const newAssigned = selectedSubs
          .filter(sub => !existingEmails.has(sub.email))
          .map(sub => ({ email: sub.email, name: sub.firstName + " " + sub.lastName, status:"sent", redeemedTier:"", date: today }));
        return { ...c, assigned: [...c.assigned, ...newAssigned] };
      }));
    }
    setPromoSending(false);
    setPromoSentMsg("Sent to " + selectedSubs.length + " contacts!");
    setTimeout(() => {
      setShowPromoModal(false);
      setPromoPickCode("");
      setPromoSentMsg("");
      setPromoModalMode("existing");
      setNewCodeForm({ code:"", type:"Discount", tier:"Any tier", discountType:"% off", value:"", campaign:"", expires:"", singleUse:false, onePerEmail:true, maxUses:null, duration:"One-time", promoMsg:"", starts:"", notes:"", assigned:[] });
      setSelectedIds(new Set());
    }, 2000);
  }
  function deletePerson(id) {
    setSubs(p => p.filter(s => s.id !== id));
    serverDelete([id]);
    if (activePerson && activePerson.id === id) setActivePerson(null);
    setConfirmDelete(null);
  }
  function deleteSelected() {
    const ids = [...selectedIds];
    setSubs(p => p.filter(s => !selectedIds.has(s.id)));
    serverDelete(ids);
    setSelectedIds(new Set());
    setActivePerson(null);
  }
  function restorePerson(id) {
    setSubs(p => p.map(s => s.id === id ? Object.assign({}, s, { archived:false, status:"Active" }) : s));
    serverPatch(id, { archived: false, status: "active" });
  }

  const filtered = useMemo(() => {
    let list = subs.filter(s => {
      if (!showArchived && s.archived) return false;
      const mSrc  = sourceFilter === "All sources"  || s.source === sourceFilter;
      const mStt  = statusFilter === "All statuses" || s.status === statusFilter;
      const mRev  = reviewFilter === "All reviews"  || (s.source === "Application" && s.reviewStatus === reviewFilter);
      const q = search.toLowerCase();
      const mSrch = !q || s.email.toLowerCase().includes(q) || s.firstName.toLowerCase().includes(q) || s.lastName.toLowerCase().includes(q) || s.tags.some(t => t.toLowerCase().includes(q));
      return mSrc && mStt && mRev && mSrch;
    });
    if (sort === "Newest first") list = [...list].reverse();
    if (sort === "Name A-Z")     list = [...list].sort((a,b) => a.lastName.localeCompare(b.lastName));
    if (sort === "Name Z-A")     list = [...list].sort((a,b) => b.lastName.localeCompare(a.lastName));
    return list;
  }, [subs, search, sourceFilter, statusFilter, reviewFilter, sort]);

  const allChecked  = filtered.length > 0 && filtered.every(s => selectedIds.has(s.id));
  const someChecked = filtered.some(s => selectedIds.has(s.id));
  function toggleRow(id) { setSelectedIds(p => { const n = new Set(p); n.has(id) ? n.delete(id) : n.add(id); return n; }); }
  function toggleAll() {
    if (allChecked) setSelectedIds(p => { const n = new Set(p); filtered.forEach(s => n.delete(s.id)); return n; });
    else            setSelectedIds(p => { const n = new Set(p); filtered.forEach(s => n.add(s.id));    return n; });
  }
  function updatePerson(id, updates) {
    setSubs(p => p.map(s => s.id === id ? Object.assign({}, s, updates) : s));
    if (activePerson && activePerson.id === id) setActivePerson(p => Object.assign({}, p, updates));
    // Map portal field names back to server field names
    const serverUpdates = {};
    if (updates.reviewStatus !== undefined) serverUpdates.review       = updates.reviewStatus;
    if (updates.notes        !== undefined) serverUpdates.notes        = updates.notes;
    if (updates.tags         !== undefined) serverUpdates.tags         = updates.tags;
    if (updates.status       !== undefined) serverUpdates.status       = updates.status.toLowerCase();
    if (updates.firstName    !== undefined) serverUpdates.first_name   = updates.firstName;
    if (updates.lastName     !== undefined) serverUpdates.last_name    = updates.lastName;
    if (updates.phone        !== undefined) serverUpdates.phone        = updates.phone;
    if (updates.expertise    !== undefined) serverUpdates.expertise    = updates.expertise;
    if (Object.keys(serverUpdates).length > 0) serverPatch(id, serverUpdates);
  }
  function downloadCSV() {
    const rows = (selectedIds.size > 0 ? filtered.filter(s => selectedIds.has(s.id)) : filtered)
      .map(s => [s.firstName, s.lastName, s.email, s.source, s.status, s.reviewStatus || "", s.tags.join("; "), s.joined, s.notes || ""]);
    const csv = [["First Name","Last Name","Email","Source","Status","Review","Tags","Joined","Notes"], ...rows].map(r => r.map(v => '"' + v + '"').join(",")).join("\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], { type:"text/csv" }));
    a.download = "sidekix-subscribers.csv"; a.click();
  }

  const stats = [
    { label:"Total",        value:subs.length,                                         onClick:() => { setSourceFilter("All sources"); setStatusFilter("All statuses"); setReviewFilter("All reviews"); } },
    { label:"Active",       value:subs.filter(s => s.status === "Active").length,       onClick:() => { setStatusFilter("Active"); setSourceFilter("All sources"); } },
    { label:"Subscribers",  value:subs.filter(s => s.source === "Subscriber").length,   onClick:() => { setSourceFilter("Subscriber"); setStatusFilter("All statuses"); } },
    { label:"Applications", value:subs.filter(s => s.source === "Application").length,  onClick:() => { setSourceFilter("Application"); setStatusFilter("All statuses"); } },
    { label:"Contacts",     value:subs.filter(s => s.source === "Contact").length,      onClick:() => { setSourceFilter("Contact"); setStatusFilter("All statuses"); } },
    { label:"Unsubscribed", value:subs.filter(s => s.status === "Unsubscribed").length, onClick:() => { setStatusFilter("Unsubscribed"); setSourceFilter("All sources"); } },
  ];
  const th = { padding:"10px 14px", textAlign:"left", fontFamily:font, fontWeight:500, fontSize:10, letterSpacing:"0.1em", textTransform:"uppercase", color:TEXT_MUTED, borderBottom:"1px solid "+BORDER, whiteSpace:"nowrap" };

  return (
    <>
    {loadingContacts && (
      <div style={{ padding:"60px 40px", textAlign:"center" }}>
        <div style={{ fontSize:13, color:TEXT_MUTED, fontFamily:font }}>Loading contacts from server…</div>
      </div>
    )}
    {loadError && !loadingContacts && (
      <div style={{ padding:"40px", textAlign:"center" }}>
        <div style={{ fontSize:13, color:"#E07070", fontFamily:font, marginBottom:12 }}>{loadError}</div>
        <button onClick={() => window.location.reload()} style={{ padding:"8px 20px", background:"none", border:"1px solid "+BORDER, borderRadius:6, color:TEXT_SECONDARY, fontSize:12, cursor:"pointer", fontFamily:font }}>Retry</button>
      </div>
    )}
    {!loadingContacts && !loadError && <div>
      {/* View toggle */}
      <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:"1rem" }}>
        <div style={{ display:"flex", background:DARK_CARD, borderRadius:6, border:"1px solid "+BORDER, overflow:"hidden" }}>
          {[{id:"list",label:"List view"},{id:"pipeline",label:"Pipeline view"}].map(v => (
            <button key={v.id} onClick={() => setSubsView(v.id)}
              style={{ padding:"7px 18px", background: subsView===v.id ? GOLD : "none", border:"none", color: subsView===v.id ? DARK_BG : TEXT_MUTED, fontSize:12, fontWeight: subsView===v.id ? 600 : 400, cursor:"pointer" }}>
              {v.label}
            </button>
          ))}
        </div>
        {subsView === "pipeline" && (
          <div style={{ fontSize:12, color:TEXT_MUTED }}>Click any applicant to review their application</div>
        )}
      </div>

      {/* Pipeline view */}
      {subsView === "pipeline" && (() => {
        const pipeApps = subs.filter(s => s.source === "Application");
        const stages = ["Pending","Under Review","Interview","Approved","Offer","Rejected","On Hold"];
        return (
          <div>
            <div style={{ display:"grid", gridTemplateColumns:"repeat(7,1fr)", gap:10, marginBottom:20 }}>
              {stages.map(stage => {
                const count = pipeApps.filter(a => (a.reviewStatus||"Pending") === stage).length;
                const colors = { Pending:"#888", "Under Review":"#B89AE8", Interview:"#6AB4E8", Approved:"#7EC87E", Offer:"#C9A96E", Rejected:"#E07070", "On Hold":"#C8986E" };
                return (
                  <div key={stage} style={{ background:DARK_CARD, border:"1px solid "+BORDER, borderRadius:8, padding:"12px 14px" }}>
                    <div style={{ fontSize:18, fontWeight:600, color:colors[stage]||GOLD, fontFamily:mono }}>{count}</div>
                    <div style={{ fontSize:11, color:TEXT_MUTED, marginTop:3 }}>{stage}</div>
                  </div>
                );
              })}
            </div>
            {stages.map(stage => {
              const applicants = pipeApps.filter(a => (a.reviewStatus||"Pending") === stage);
              if (!applicants.length) return null;
              const colors = { Pending:"#888", "Under Review":"#B89AE8", Interview:"#6AB4E8", Approved:"#7EC87E", Offer:"#C9A96E", Rejected:"#E07070", "On Hold":"#C8986E" };
              return (
                <div key={stage} style={{ marginBottom:20 }}>
                  <div style={{ fontSize:11, fontWeight:600, color:colors[stage], textTransform:"uppercase", letterSpacing:"0.06em", marginBottom:8 }}>{stage} · {applicants.length}</div>
                  <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))", gap:10 }}>
                    {applicants.map(a => (
                      <div key={a.id} onClick={() => setActivePerson(a)}
                        style={{ background:DARK_CARD, border:"1px solid "+BORDER, borderRadius:8, padding:"14px 16px", cursor:"pointer" }}
                        onMouseEnter={e => e.currentTarget.style.borderColor=GOLD}
                        onMouseLeave={e => e.currentTarget.style.borderColor=BORDER}>
                        <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:10 }}>
                          <Avatar first={a.firstName} last={a.lastName} />
                          <div>
                            <div style={{ fontSize:13, fontWeight:500, color:TEXT_PRIMARY }}>{a.firstName} {a.lastName}</div>
                            <div style={{ fontSize:11, color:TEXT_MUTED }}>{a.email}</div>
                          </div>
                        </div>
                        <div style={{ display:"flex", gap:6, flexWrap:"wrap" }}>
                          {(a.tags||[]).map((t,i) => <Tag key={i} label={t} />)}
                        </div>
                        <div style={{ fontSize:11, color:TEXT_MUTED, marginTop:8 }}>Applied {a.joined}</div>
                      </div>
                    ))}
                  </div>
                </div>
              );
            })}
            {activePerson && activePerson.source === "Application" && (
              <ApplicationModal person={activePerson} onClose={() => setActivePerson(null)} onUpdate={updatePerson} onArchive={id => { setSubs(p => p.map(s => s.id===id ? {...s,archived:true} : s)); serverPatch(id,{archived:true}); }} onDelete={id => { setSubs(p => p.filter(s => s.id!==id)); serverDelete([id]); }} />
            )}
          </div>
        );
      })()}

      {/* List view */}
      <div style={{ display: subsView === "list" ? "grid" : "none", gridTemplateColumns: isMobile ? "repeat(3,1fr)" : "repeat(6,1fr)", gap:10, marginBottom:"1.5rem" }}>
        {stats.map(({ label, value, onClick }) => (
          <div key={label} onClick={onClick} style={{ background:DARK_CARD, border:"1px solid "+BORDER, borderRadius:4, padding:"12px 16px", cursor:"pointer" }}>
            <div style={{ fontSize:10, fontFamily:font, fontWeight:500, letterSpacing:"0.1em", textTransform:"uppercase", color:TEXT_MUTED, marginBottom:4 }}>{label}</div>
            <div style={{ fontSize:26, fontFamily:serif, color:TEXT_PRIMARY }}>{value}</div>
          </div>
        ))}
      </div>
      <div style={{ display: subsView === "list" ? "grid" : "none", gridTemplateColumns:activePerson && activePerson.source !== "Application" ? "1fr 340px" : "1fr", gap:"1.25rem", alignItems:"start" }}>
        <div>
          <div style={{ display:"flex", gap:8, marginBottom:"0.75rem", alignItems:"center", flexWrap:"wrap" }}>
            <input type="text" placeholder="Search name, email, tag…" value={search} onChange={e => setSearch(e.target.value)} style={inp({ flex:1, minWidth:180 })} />
            <select value={sourceFilter} onChange={e => setSourceFilter(e.target.value)} style={inp({ width:"auto", cursor:"pointer" })}>{ALL_SOURCES.map(o => <option key={o} value={o}>{o}</option>)}</select>
            <select value={statusFilter} onChange={e => setStatusFilter(e.target.value)} style={inp({ width:"auto", cursor:"pointer" })}>{ALL_STATUSES.map(o => <option key={o} value={o}>{o}</option>)}</select>
            <select value={reviewFilter} onChange={e => setReviewFilter(e.target.value)} style={inp({ width:"auto", cursor:"pointer" })}>{ALL_REVIEW.map(o => <option key={o} value={o}>{o}</option>)}</select>
            <select value={sort}         onChange={e => setSort(e.target.value)}         style={inp({ width:"auto", cursor:"pointer" })}>{ALL_SORT.map(o => <option key={o} value={o}>{o}</option>)}</select>
            <button onClick={downloadCSV} style={{ padding:"9px 16px", fontSize:11, fontWeight:600, letterSpacing:"0.08em", textTransform:"uppercase", borderRadius:4, border:"none", background:GOLD, color:"#1C1A14", cursor:"pointer", fontFamily:font, whiteSpace:"nowrap" }}>
              ↓ Export {selectedIds.size > 0 ? selectedIds.size + " selected" : "all " + filtered.length}
            </button>
            <button onClick={() => setShowArchived(a => !a)} style={{ padding:"9px 14px", fontSize:11, fontWeight:600, letterSpacing:"0.08em", textTransform:"uppercase", borderRadius:4, border:"1px solid "+BORDER, background:showArchived ? DARK_CARD2 : "transparent", color:showArchived ? GOLD : TEXT_MUTED, cursor:"pointer", fontFamily:font, whiteSpace:"nowrap" }}>
              {showArchived ? "Hide Archived" : "Show Archived"}
            </button>
          </div>
          {selectedIds.size > 0 && (
            <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:"0.75rem", padding:"8px 12px", background:"rgba(201,169,110,0.08)", border:"1px solid rgba(201,169,110,0.2)", borderRadius:4, fontSize:12, color:GOLD_LIGHT, fontFamily:font }}>

              <button onClick={archiveSelected} style={{ fontSize:10, padding:"4px 12px", borderRadius:3, border:"1px solid "+BORDER, background:"transparent", color:TEXT_SECONDARY, cursor:"pointer", fontFamily:font, textTransform:"uppercase", letterSpacing:"0.06em" }}>Archive Selected</button>
              <button onClick={() => { if(window.confirm("Delete " + selectedIds.size + " contact(s)? This cannot be undone.")) deleteSelected(); }} style={{ fontSize:10, padding:"4px 12px", borderRadius:3, border:"1px solid rgba(220,100,100,0.3)", background:"rgba(220,100,100,0.08)", color:"#E07070", cursor:"pointer", fontFamily:font, textTransform:"uppercase", letterSpacing:"0.06em" }}>Delete Selected</button>
              <button onClick={() => setSelectedIds(new Set())} style={{ marginLeft:"auto", background:"none", border:"none", color:TEXT_MUTED, cursor:"pointer", fontSize:11, fontFamily:font }}>Clear</button>
            </div>

          <div style={{ border:"1px solid "+BORDER, borderRadius:6, overflow:"hidden" }}>
            <table style={{ width:"100%", borderCollapse:"collapse", fontSize:12, tableLayout:"fixed" }}>
              <colgroup>
                <col style={{ width:"4%" }}/><col style={{ width:"19%" }}/><col style={{ width:"17%" }}/>
                <col style={{ width:"10%" }}/><col style={{ width:"10%" }}/><col style={{ width:"10%" }}/>
                <col style={{ width:"13%" }}/><col style={{ width:"10%" }}/><col style={{ width:"9%" }}/>
              </colgroup>
              <thead>
                <tr style={{ background:DARK_CARD2 }}>
                  <th style={th}><input type="checkbox" checked={allChecked} ref={el => { if (el) el.indeterminate = someChecked && !allChecked; }} onChange={toggleAll} style={{ width:14, height:14, accentColor:GOLD, cursor:"pointer" }} /></th>
                  {["Name","Email","Source","Status","Review","Tags","Assigned","Joined"].map(h => <th key={h} style={th}>{h}</th>)}
                </tr>
              </thead>
              <tbody>
                {filtered.length === 0
                  ? <tr><td colSpan={9} style={{ padding:"2.5rem", textAlign:"center", color:TEXT_MUTED, fontFamily:font }}><span>No subscribers match your filters. </span><button onClick={() => { setSearch(""); setSourceFilter("All sources"); setStatusFilter("All statuses"); setReviewFilter("All reviews"); }} style={{ background:"none", border:"none", color:GOLD, cursor:"pointer", fontSize:12, textDecoration:"underline", fontFamily:font }}>Clear filters</button></td></tr>
                  : filtered.map((s, i) => {
                    const isSel = selectedIds.has(s.id);
                    const isAct = activePerson && activePerson.id === s.id;
                    return (
                      <tr key={s.id} onClick={() => setActivePerson(isAct ? null : s)} style={{ borderBottom: i < filtered.length - 1 ? "1px solid "+BORDER : "none", background: isAct ? "rgba(201,169,110,0.07)" : isSel ? "rgba(201,169,110,0.04)" : "transparent", cursor:"pointer" }}>
                        <td style={{ padding:"10px 14px" }}><input type="checkbox" checked={isSel} onChange={() => toggleRow(s.id)} onClick={e => e.stopPropagation()} style={{ width:14, height:14, accentColor:GOLD, cursor:"pointer" }} /></td>
                        <td style={{ padding:"10px 14px" }}>
                          <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                            <Avatar first={s.firstName} last={s.lastName} />
                            <div>
                              <div style={{ fontSize:13, fontFamily:serif, color:TEXT_PRIMARY, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{s.firstName} {s.lastName}</div>
                              <div style={{ fontSize:10, color:TEXT_MUTED, marginTop:1 }}>Click to view →</div>
                            </div>
                          </div>
                        </td>
                        <td style={{ padding:"10px 14px", color:TEXT_SECONDARY, fontFamily:mono, fontSize:11, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{s.email}</td>
                        <td style={{ padding:"10px 14px" }}><SourceTag source={s.source} /></td>
                        <td style={{ padding:"10px 14px" }}><StatusTag status={s.status} /></td>
                        <td style={{ padding:"10px 14px" }}>{s.source === "Application" ? <ReviewTag status={s.reviewStatus || "Pending"} /> : <span style={{ color:TEXT_MUTED, fontSize:12 }}>—</span>}</td>
                        <td style={{ padding:"10px 14px" }}>
                          <div style={{ display:"flex", gap:4, flexWrap:"wrap" }}>
                            {s.tags.slice(0,2).map((t, j) => <Tag key={j} label={t} style={{ background:DARK_CARD2, color:TEXT_SECONDARY, border:"1px solid "+BORDER, fontSize:10 }} />)}
                            {s.tags.length > 2 && <span style={{ fontSize:10, color:TEXT_MUTED, fontFamily:font }}>+{s.tags.length - 2}</span>}
                          </div>
                        </td>
                        <td style={{ padding:"10px 14px" }}>
                          {s.assignedTo && s.assignedTo.length > 0
                            ? <div style={{ display:"flex", gap:3 }}>
                                <span style={{ fontSize:10, padding:"2px 6px", borderRadius:3, background:"rgba(201,169,110,0.1)", border:"1px solid rgba(201,169,110,0.2)", color:GOLD_LIGHT, fontFamily:font }}>{s.assignedTo[0].split("@")[0]}</span>
                                {s.assignedTo.length > 1 && <span style={{ fontSize:10, color:TEXT_MUTED, fontFamily:font }}>+{s.assignedTo.length - 1}</span>}
                              </div>
                            : <span style={{ color:TEXT_MUTED, fontSize:12 }}>—</span>}
                        </td>
                        <td style={{ padding:"10px 14px", color:TEXT_MUTED, fontFamily:font, fontSize:11, whiteSpace:"nowrap" }}>
                          <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", gap:6 }}>
                            <span>{s.joined}</span>
                            <RowMenu
                              archived={s.archived}
                              isUnsubscribed={s.status === "Unsubscribed"}
                              onArchive={e => { e.stopPropagation(); archivePerson(s.id); }}
                              onRestore={e => { e.stopPropagation(); restorePerson(s.id); }}
                              onDelete={e => { e.stopPropagation(); if(window.confirm("Delete " + s.firstName + " " + s.lastName + "? This cannot be undone.")) deletePerson(s.id); }}
                              onUnsubscribe={e => { e.stopPropagation(); unsubscribePerson(s.id, s.email); }}
                            />
                          </div>
                        </td>
                      </tr>
                    );
                  })
                }
              </tbody>
            </table>
          </div>
          <div style={{ marginTop:"0.75rem", fontSize:11, color:TEXT_MUTED, fontFamily:font }}>{filtered.length} of {subs.length} subscribers · Click any row to view details</div>
        </div>
        {activePerson && activePerson.source !== "Application" && <SidePanel person={activePerson} onClose={() => setActivePerson(null)} onUpdate={updatePerson} />}
        {activePerson && activePerson.source === "Application" && <ApplicationModal person={activePerson} onClose={() => setActivePerson(null)} onUpdate={updatePerson} onArchive={id => { archivePerson(id); }} onDelete={id => { deletePerson(id); }} />}
      </div>
    {/* Promo Code Send Modal */}
    {showPromoModal && (
      <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.75)", zIndex:1000, display:"flex", alignItems:"center", justifyContent:"center" }} onClick={() => !promoSending && setShowPromoModal(false)}
        onKeyDown={e => e.key === "Escape" && !promoSending && setShowPromoModal(false)}>
        <div style={{ background:DARK_CARD, border:"1px solid "+BORDER, borderRadius:12, padding:32, width:440, maxWidth:"90vw" }} onClick={e => e.stopPropagation()}>
          <div style={{ fontFamily:serif, fontSize:20, fontWeight:300, color:GOLD, marginBottom:6 }}>Send Promo Code</div>
          <div style={{ fontSize:13, color:TEXT_MUTED, marginBottom:16 }}>
            Sending to <strong style={{ color:TEXT_PRIMARY }}>{selectedIds.size} subscriber{selectedIds.size !== 1 ? "s" : ""}</strong>. Each recipient will be tracked in the Promo Codes tab.

// ─── Pipeline Tab ─────────────────────────────────────────────────────────────
function PipelineTab() {
  const width = useWindowWidth();
  const isMobile = width < 768;
  const [activePerson, setActivePerson] = useState(null);
  const [allApps, setAllApps] = useState([]);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    fetch(SERVER_URL + "/contacts", { headers: { "X-SideKix-Secret": SERVER_SECRET } })
      .then(r => r.json())
      .then(data => {
        if (data.success) {
          const apps = data.contacts
            .filter(c => c.source === "application" || c.form_type === "application")
            .map(c => ({
              id:           c.id,
              firstName:    c.first_name  || "",
              lastName:     c.last_name   || "",
              email:        c.email       || "",
              phone:        c.phone       || "",
              source:       "Application",
              reviewStatus: c.review      || "Pending",
              tags:         c.tags        || [],
              notes:        c.notes       || "",
              expertise:    c.expertise   || "",
              background:   c.background  || "",
              strengths:    c.strengths   || "",
              challenge:    c.challenge   || "",
              whySidekix:   c.why_sidekix || "",
              linkedin:     c.linkedin    || "",
              website:      c.website     || "",
              city:         c.city        || "",
              zip:          c.zip_code    || "",
              socialHandles:c.social_handles || "",
              languages:    c.languages   || "",
              resume:       c.resume_url  || "",
              resumeName:   c.resume_url ? c.resume_url.split("/").pop() : "",
              yearsOwner:   c.years_owner || "",
              businessTypes:c.business_types || "",
              prevAdvisor:  c.prev_advisor || "",
              statusHistory: c.status_history || [],
              joined:       c.created_at ? new Date(c.created_at).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}) : "",
            }));
          setAllApps(apps);
        }
      })
      .catch(e => console.warn("PipelineTab load failed:", e))
      .finally(() => setLoading(false));
  }, []);

  function updatePerson(id, updates) {
    setAllApps(prev => prev.map(s => s.id === id ? Object.assign({}, s, updates) : s));
    if (activePerson && activePerson.id === id) setActivePerson(prev => Object.assign({}, prev, updates));
    // Persist to server
    const serverUpdates = {};
    if (updates.reviewStatus !== undefined) serverUpdates.review = updates.reviewStatus;
    if (updates.notes        !== undefined) serverUpdates.notes  = updates.notes;
    if (Object.keys(serverUpdates).length > 0) {
      fetch(SERVER_URL + "/contacts/" + id, {
        method: "PATCH",
        headers: { "Content-Type":"application/json", "X-SideKix-Secret": SERVER_SECRET },
        body: JSON.stringify(serverUpdates),
      }).catch(e => console.warn("Pipeline patch failed:", e));
    }
  }
  const apps = allApps.filter(s => s.statusHistory);
  const rows = apps.map(s => {
    const h = s.statusHistory || [];
    function days(from, to) {
      const f = h.find(x => x.status === from), t = h.find(x => x.status === to);
      if (!f || !t) return null;
      return Math.round((new Date(t.date) - new Date(f.date)) / 86400000);
    }
    return { ...s, appToReview: days("Pending","Under Review"), reviewToIntv: days("Under Review","Interview"), intvToApprove: days("Interview","Approved"), appToHired: days("Pending","Approved") };
  });
  function avg(key) {
    const vals = rows.map(r => r[key]).filter(v => v !== null && v !== undefined);
    if (!vals.length) return "—";
    return (vals.reduce((a,b) => a+b, 0) / vals.length).toFixed(1) + " days";
  }
  const stages = [
    { label:"Application → Under Review", key:"appToReview",   color:"#B89AE8" },
    { label:"Under Review → Interview",   key:"reviewToIntv",  color:"#6AB4E8" },
    { label:"Interview → Approved",       key:"intvToApprove", color:"#7EC87E" },
    { label:"Application → Hired",        key:"appToHired",    color:GOLD      },
  ];
  const th = { padding:"9px 14px", textAlign:"left", fontFamily:font, fontWeight:500, fontSize:10, letterSpacing:"0.1em", textTransform:"uppercase", color:TEXT_MUTED, borderBottom:"1px solid "+BORDER, whiteSpace:"nowrap" };
  return (
    <>
    {loading && <div style={{ padding:"60px 40px", textAlign:"center", color:TEXT_MUTED, fontSize:13, fontFamily:font }}>Loading pipeline…</div>}
    {!loading && <div>
      <div style={{ display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:10, marginBottom:"1.5rem" }}>
        {stages.map(s => (
          <div key={s.key} style={{ background:DARK_CARD, border:"1px solid "+BORDER, borderRadius:4, padding:"14px 18px" }}>
            <div style={{ fontSize:10, fontFamily:font, fontWeight:500, letterSpacing:"0.08em", textTransform:"uppercase", color:TEXT_MUTED, marginBottom:6, lineHeight:1.4 }}>{s.label}</div>
            <div style={{ fontSize:26, fontFamily:serif, color:s.color }}>{avg(s.key)}</div>
            <div style={{ fontSize:10, fontFamily:font, color:TEXT_MUTED, marginTop:2 }}>{rows.filter(r => r[s.key] !== null && r[s.key] !== undefined).length} applicants</div>
          </div>
        ))}
      </div>
      <div style={{ border:"1px solid "+BORDER, borderRadius:6, overflowX: isMobile ? "auto" : "hidden" }}>
        <table style={{ width:"100%", minWidth: isMobile ? 600 : "auto", borderCollapse:"collapse", fontSize:12, tableLayout:"fixed" }}>
          <colgroup><col style={{ width:"18%" }}/><col style={{ width:"14%" }}/><col style={{ width:"17%" }}/><col style={{ width:"17%" }}/><col style={{ width:"17%" }}/><col style={{ width:"17%" }}/></colgroup>
          <thead>
            <tr style={{ background:DARK_CARD2 }}>
              <th style={th}>Applicant</th><th style={th}>Stage</th>
              <th style={{ ...th, color:"#B89AE8" }}>→ Under Review</th>
              <th style={{ ...th, color:"#6AB4E8" }}>→ Interview</th>
              <th style={{ ...th, color:"#7EC87E" }}>→ Approved</th>
              <th style={{ ...th, color:GOLD }}>Total Cycle</th>
            </tr>
          </thead>
          <tbody>
            {rows.length === 0
              ? <tr><td colSpan={6} style={{ padding:"40px", textAlign:"center", color:TEXT_MUTED, fontFamily:font }}>No applicants with status history yet.</td></tr>
              : rows.map((r, i) => (
              <tr key={r.id} onClick={() => setActivePerson(allApps.find(a => a.id === r.id))}
                style={{ borderBottom: i < rows.length - 1 ? "1px solid "+BORDER : "none", cursor:"pointer" }}
                onMouseEnter={e => e.currentTarget.style.background="rgba(201,169,110,0.04)"}
                onMouseLeave={e => e.currentTarget.style.background="transparent"}>
                <td style={{ padding:"10px 14px" }}>
                  <div style={{ fontSize:13, fontFamily:serif, color:TEXT_PRIMARY }}>{r.firstName} {r.lastName}</div>
                  <div style={{ fontSize:10, fontFamily:font, color:TEXT_MUTED, marginTop:1 }}>Applied {r.joined}</div>
                </td>
                <td style={{ padding:"10px 14px" }}><ReviewTag status={r.reviewStatus || "Pending"} /></td>
                {["appToReview","reviewToIntv","intvToApprove","appToHired"].map(key => (
                  <td key={key} style={{ padding:"10px 14px", fontFamily:font, fontSize:12, color: r[key] !== null && r[key] !== undefined ? TEXT_SECONDARY : TEXT_MUTED }}>
                    {r[key] !== null && r[key] !== undefined ? r[key] + "d" : "—"}
                  </td>
                ))}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <div style={{ marginTop:"0.75rem", fontSize:11, color:TEXT_MUTED, fontFamily:font }}>* "d" = days from status change timestamps.</div>
    {activePerson && (
      <ApplicationModal
        person={activePerson}
        onClose={() => setActivePerson(null)}
        onUpdate={(id, updates) => updatePerson(id, updates)}
        onArchive={id => {
          setAllApps(p => p.filter(a => a.id !== id));
          fetch(SERVER_URL + "/contacts/" + id, {
            method:"PATCH",
            headers:{"Content-Type":"application/json","X-SideKix-Secret":SERVER_SECRET},
            body:JSON.stringify({archived:true}),
          }).catch(e => console.warn(e));
          setActivePerson(null);
        }}
        onDelete={id => {
          setAllApps(p => p.filter(a => a.id !== id));
          fetch(SERVER_URL + "/contacts", {
            method:"DELETE",
            headers:{"Content-Type":"application/json","X-SideKix-Secret":SERVER_SECRET},
            body:JSON.stringify({ids:[id]}),
          }).catch(e => console.warn(e));
          setActivePerson(null);
        }}
      />
    )}
    </div>}
    </>
  );
}

// ─── Send Log Tab ─────────────────────────────────────────────────────────────
function SendLogTab() {
  const width = useWindowWidth();
  const isMobile = width < 768;
  const [logData,        setLogData]        = useState([]);
  const [loading,        setLoading]        = useState(true);
  const [logType,        setLogType]        = useState("All emails");
  const [statusFilter,   setStatusFilter]   = useState("All statuses");
  const [search,         setSearch]         = useState("");
  const [selectedIds,    setSelectedIds]    = useState(new Set());
  const [showPromoModal, setShowPromoModal] = useState(false);

  // Load from server on mount
  useEffect(() => {
    fetch(SERVER_URL + "/sendlog", { headers: { "X-SideKix-Secret": SERVER_SECRET } })
      .then(r => r.json())
      .then(data => {
        if (data.success && Array.isArray(data.logs)) {
          // Normalize server field names to what the UI expects
          const normalized = data.logs.map(l => ({
            id:           l.id,
            firstName:    l.first_name || "",
            lastName:     l.last_name  || "",
            to:           l.email      || "",
            template:     l.template   || "",
            subject:      l.subject    || "",
            routedTo:     l.routed_to  || "",
            logType:      l.log_type   || "subscriber",
            status:       l.status     || "delivered",
            opened:       l.opened     || false,
            clicked:      l.clicked    || false,
            unsubscribed: l.unsubscribed || false,
            time:         l.time       || "",
          }));
          // Most recent first
          setLogData(normalized.reverse());
        }
      })
      .catch(e => console.warn("SendLog fetch failed:", e))
      .finally(() => setLoading(false));
  }, []);

  function archiveSelected() {
    const ids = [...selectedIds];
    setLogData(p => p.filter(r => !selectedIds.has(r.id)));
    setSelectedIds(new Set());
    fetch(SERVER_URL + "/sendlog", {
      method: "DELETE",
      headers: { "Content-Type":"application/json", "X-SideKix-Secret": SERVER_SECRET },
      body: JSON.stringify({ ids }),
    }).catch(e => console.warn(e));
  }
  function deleteSelected() {
    if (window.confirm("Delete " + selectedIds.size + " record(s)? This cannot be undone.")) {
      const ids = [...selectedIds];
      setLogData(p => p.filter(r => !selectedIds.has(r.id)));
      setSelectedIds(new Set());
      fetch(SERVER_URL + "/sendlog", {
        method: "DELETE",
        headers: { "Content-Type":"application/json", "X-SideKix-Secret": SERVER_SECRET },
        body: JSON.stringify({ ids }),
      }).catch(e => console.warn(e));
    }
  }

  const filtered = logData.filter(r => {
    const mType = logType === "All emails" || (logType === "Subscriber emails" && r.logType === "subscriber") || (logType === "Advisor emails" && r.logType === "advisor");
    const mStt  = statusFilter === "All statuses" || (statusFilter === "Delivered" && r.status === "delivered" && !r.unsubscribed) || (statusFilter === "Bounced" && r.status === "bounced") || (statusFilter === "Unsubscribed" && r.unsubscribed);
    const q = search.toLowerCase();
    const mSrch = !q || r.to.toLowerCase().includes(q) || r.firstName.toLowerCase().includes(q) || r.lastName.toLowerCase().includes(q);
    return mType && mStt && mSrch;
  });

  const allChecked  = filtered.length > 0 && filtered.every(r => selectedIds.has(r.id));
  const someChecked = filtered.some(r => selectedIds.has(r.id));
  function toggleRow(id) { setSelectedIds(p => { const n = new Set(p); n.has(id) ? n.delete(id) : n.add(id); return n; }); }
  function toggleAll() {
    if (allChecked) setSelectedIds(p => { const n = new Set(p); filtered.forEach(r => n.delete(r.id)); return n; });
    else            setSelectedIds(p => { const n = new Set(p); filtered.forEach(r => n.add(r.id));    return n; });
  }
  function toggleUnsub(id) { setLogData(p => p.map(r => r.id === id ? Object.assign({}, r, { unsubscribed: !r.unsubscribed }) : r)); }
  function downloadCSV() {
    const rows = (selectedIds.size > 0 ? filtered.filter(r => selectedIds.has(r.id)) : filtered)
      .map(r => [r.firstName, r.lastName, r.to, r.template, r.routedTo, r.status, r.opened ? "Yes" : "No", r.clicked ? "Yes" : "No", r.unsubscribed ? "Yes" : "No", r.logType, r.time]);
    const csv = [["First","Last","Email","Template","Routed To","Status","Opened","Clicked","Unsubscribed","Type","Sent"], ...rows].map(row => row.map(v => '"' + v + '"').join(",")).join("\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], { type:"text/csv" }));
    a.download = "sidekix-send-log.csv"; a.click();
  }

  const subLogs = logData.filter(r => r.logType === "subscriber");
  const advLogs = logData.filter(r => r.logType === "advisor");
  const th = { padding:"10px 12px", textAlign:"left", fontFamily:font, fontWeight:500, fontSize:10, letterSpacing:"0.1em", textTransform:"uppercase", color:TEXT_MUTED, borderBottom:"1px solid "+BORDER };

  return (
    <div>
    {loading && <div style={{ padding:"60px 40px", textAlign:"center", color:TEXT_MUTED, fontSize:13, fontFamily:font }}>Loading send log…</div>}
    {!loading && <div>
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:"1rem", marginBottom:"1.5rem" }}>
        {[{ title:"Subscriber Emails", logs:subLogs, from:"joinus@sidekixhq.com" }, { title:"Advisor Emails", logs:advLogs, from:"Advisors@sidekixhq.com" }].map(({ title, logs, from }) => (
          <div key={title} style={{ background:DARK_CARD, border:"1px solid "+BORDER, borderRadius:6, padding:"1rem" }}>
            <div style={{ fontSize:11, fontFamily:font, fontWeight:500, letterSpacing:"0.1em", textTransform:"uppercase", color:TEXT_MUTED, marginBottom:"0.75rem" }}>
              {title} <span style={{ fontWeight:400, textTransform:"none" }}>· {from}</span>
            </div>
            <div style={{ display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:8 }}>
              {[["Sent", logs.length], ["Delivered", logs.filter(r => r.status === "delivered").length], ["Opened", logs.filter(r => r.opened).length], ["Unsub'd", logs.filter(r => r.unsubscribed).length]].map(([label, val]) => (
                <div key={label}>
                  <div style={{ fontSize:10, fontFamily:font, color:TEXT_MUTED, letterSpacing:"0.08em", textTransform:"uppercase", marginBottom:3 }}>{label}</div>
                  <div style={{ fontSize:22, fontFamily:serif, color:TEXT_PRIMARY }}>{val}</div>
                </div>
              ))}
            </div>
          </div>
        ))}
      </div>
      <div style={{ display:"flex", gap:8, marginBottom:"0.75rem", alignItems:"center", flexWrap:"wrap" }}>
        <input type="text" placeholder="Search name or email…" value={search} onChange={e => setSearch(e.target.value)} style={inp({ flex:1, minWidth:160 })} />
        <select value={logType}      onChange={e => setLogType(e.target.value)}      style={inp({ width:"auto", cursor:"pointer" })}>{LOG_TYPES.map(o => <option key={o} value={o}>{o}</option>)}</select>
        <select value={statusFilter} onChange={e => setStatusFilter(e.target.value)} style={inp({ width:"auto", cursor:"pointer" })}>{LOG_STATUSES.map(o => <option key={o} value={o}>{o}</option>)}</select>
        <button onClick={downloadCSV} style={{ padding:"9px 16px", fontSize:11, fontWeight:600, letterSpacing:"0.08em", textTransform:"uppercase", borderRadius:4, border:"none", background:GOLD, color:"#1C1A14", cursor:"pointer", fontFamily:font, whiteSpace:"nowrap" }}>
          ↓ Export {selectedIds.size > 0 ? selectedIds.size + " selected" : "all " + filtered.length}
        </button>
      </div>
      {selectedIds.size > 0 && (
        <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:"0.75rem", padding:"8px 12px", background:"rgba(201,169,110,0.08)", border:"1px solid rgba(201,169,110,0.2)", borderRadius:4, fontSize:12, color:GOLD_LIGHT, fontFamily:font }}>
          <span style={{ fontWeight:600 }}>{selectedIds.size} selected</span>

          <button onClick={() => setSelectedIds(new Set())} style={{ marginLeft:"auto", background:"none", border:"none", color:TEXT_MUTED, cursor:"pointer", fontSize:11, fontFamily:font }}>Clear</button>
        </div>
      )}
      <div style={{ border:"1px solid "+BORDER, borderRadius:6, overflowX: isMobile ? "auto" : "hidden" }}>
        <table style={{ width:"100%", minWidth: isMobile ? 600 : "auto", borderCollapse:"collapse", fontSize:12, tableLayout:"fixed" }}>
          <colgroup>
            <col style={{ width:"3%" }}/><col style={{ width:"12%" }}/><col style={{ width:"16%" }}/>
            <col style={{ width:"15%" }}/><col style={{ width:"15%" }}/><col style={{ width:"9%" }}/>

          <thead>
            <tr style={{ background:DARK_CARD2 }}>
              <th style={th}><input type="checkbox" checked={allChecked} ref={el => { if (el) el.indeterminate = someChecked && !allChecked; }} onChange={toggleAll} style={{ width:14, height:14, accentColor:GOLD, cursor:"pointer" }} /></th>

                    <td style={{ padding:"10px 12px" }}><input type="checkbox" checked={isSel} onChange={() => toggleRow(r.id)} onClick={e => e.stopPropagation()} style={{ width:14, height:14, accentColor:GOLD, cursor:"pointer" }} /></td>
                    <td style={{ padding:"10px 12px", color:TEXT_PRIMARY, fontFamily:font, fontSize:12, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{r.firstName} {r.lastName}</td>

                    <td style={{ padding:"10px 12px", color:TEXT_SECONDARY, fontFamily:font, fontSize:11, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{r.template}</td>
                    <td style={{ padding:"10px 12px", color:TEXT_MUTED, fontFamily:mono, fontSize:10, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{r.routedTo}</td>
                    <td style={{ padding:"10px 12px" }}>
                      <span style={{ fontSize:10, padding:"3px 7px", borderRadius:3, fontFamily:font, fontWeight:500, textTransform:"uppercase", background: r.status === "delivered" ? "rgba(201,169,110,0.1)" : "rgba(220,100,100,0.1)", color: r.status === "delivered" ? GOLD : "#E07070", border:"1px solid " + (r.status === "delivered" ? "rgba(201,169,110,0.2)" : "rgba(220,100,100,0.2)") }}>
                        {r.status}
                      </span>
                    </td>
                    <td style={{ padding:"10px 12px", textAlign:"center", fontSize:11, color: r.opened ? TEXT_SECONDARY : TEXT_MUTED }}>
                      {r.status === "bounced" ? "—" : r.opened ? "👁" : "—"}
                    </td>
                    <td style={{ padding:"10px 12px", textAlign:"center", fontSize:11, color: r.clicked ? TEXT_SECONDARY : TEXT_MUTED }}>
                      {r.status === "bounced" || !r.opened ? "—" : r.clicked ? "🔗" : "—"}
                    </td>
                    <td style={{ padding:"10px 12px", textAlign:"center" }} onClick={e => e.stopPropagation()}>
                      <button onClick={() => toggleUnsub(r.id)} style={{ fontSize:10, padding:"2px 7px", borderRadius:3, border:"1px solid " + (r.unsubscribed ? "rgba(220,100,100,0.3)" : BORDER), background: r.unsubscribed ? "rgba(220,100,100,0.12)" : "transparent", color: r.unsubscribed ? "#E07070" : TEXT_MUTED, cursor:"pointer", fontFamily:font, textTransform:"uppercase" }}>
                        {r.unsubscribed ? "Unsub'd" : "—"}
                      </button>
                    </td>
                    <td style={{ padding:"10px 12px", color:TEXT_MUTED, fontFamily:font, fontSize:11 }}>{r.time}</td>
                  </tr>
                );
              })
            }
          </tbody>
        </table>
      </div>
      <div style={{ marginTop:"0.75rem", fontSize:11, color:TEXT_MUTED, fontFamily:font }}>
        {filtered.length} of {logData.length} records · 👁 opened · 🔗 clicked
      </div>
    </div>}
    </div>
  );
}

function CustomersTab() {
  const width = useWindowWidth();
  const isMobile = width < 768;
  const [subTab,      setSubTab]      = useState("active");

  const [selectedIds, setSelectedIds] = useState(new Set());

  const [inviteSent,  setInviteSent]  = useState(false);
  const [memberFilter, setMemberFilter] = useState("All");

  const bySubTab = MOCK_CUSTOMERS.filter(c => {
    if (subTab === "active")    return c.status === "Active";
    if (subTab === "invited")   return c.status === "Invited";
    if (subTab === "suspended") return c.status === "Suspended";
    if (subTab === "sessions")  return c.sessions > 0;
    return true;
  });

  const filtered = bySubTab.filter(c => {
    const q = search.toLowerCase();
    const matchSearch = !q || (c.firstName + " " + c.lastName).toLowerCase().includes(q) || c.email.toLowerCase().includes(q);
    const matchMember = memberFilter === "All" || c.membershipType === memberFilter;
    return matchSearch && matchMember;
  });

  const allSelected = filtered.length > 0 && filtered.every(c => selectedIds.has(c.id));
  function toggleAll() {
    if (allSelected) setSelectedIds(new Set());
    else setSelectedIds(new Set(filtered.map(c => c.id)));
  }

  function exportCSV() {
    const headers = ["First","Last","Email","Phone","Membership","Duration","Sessions","Status","Labels","Joined"];
    const rows = filtered.map(c => [c.firstName,c.lastName,c.email,c.phone,c.membershipType,c.membershipDuration,c.sessions,c.status,c.labels.join("; "),c.joined]);
    const csv = [headers,...rows].map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\n");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv],{type:"text/csv"})); a.download="sidekix-customers.csv"; a.click();
  }

  const tabCounts = {
    active:    MOCK_CUSTOMERS.filter(c => c.status === "Active").length,
    invited:   MOCK_CUSTOMERS.filter(c => c.status === "Invited").length,
    suspended: MOCK_CUSTOMERS.filter(c => c.status === "Suspended").length,
    sessions:  MOCK_CUSTOMERS.filter(c => c.sessions > 0).length,
  };

  const SUBTABS = [
    { id:"active",    label:"Active" },
    { id:"sessions",  label:"Sessions" },
    { id:"invited",   label:"Invited" },
    { id:"suspended", label:"Suspended" },
  ];

  const MEMBER_FILTERS = ["All","Pay as you grow","Core Package","Premium Package"];

  return (
    <div style={{ padding: isMobile ? "16px" : "28px 32px", maxWidth:1200, margin:"0 auto" }}>
      {/* Header */}

function PromoCodeDetail({ code, onBack, onUpdate }) {
  const [activeTab, setActiveTab] = useState("all");
  const [assignEmail, setAssignEmail] = useState("");
  const [showAssignDone, setShowAssignDone] = useState(false);

  const redeemed    = code.assigned.filter(a => a.status === "redeemed");
  const opened      = code.assigned.filter(a => a.status === "opened");
  const sent        = code.assigned.filter(a => a.status === "sent");
  const notRedeemed = [...opened, ...sent];

  const filteredAssigned = activeTab === "all" ? code.assigned
    : activeTab === "redeemed" ? redeemed
    : activeTab === "opened"   ? opened
    : sent;

  const convRate = code.assigned.length > 0 ? Math.round((redeemed.length / code.assigned.length) * 100) : 0;

  function handleAssign() {
    if (!assignEmail.trim()) return;
    const updated = { ...code, assigned: [...code.assigned, { email:assignEmail, name:assignEmail.split("@")[0], status:"sent", redeemedTier:"", date:"" }] };
    onUpdate(updated);
    setAssignEmail("");
    setShowAssignDone(true);
    setTimeout(() => setShowAssignDone(false), 2000);
  }

  function handleRemind(email) { alert("Reminder sent to " + email); }
  function handleRemindAll() { alert("Reminder sent to " + notRedeemed.length + " people who haven't redeemed yet."); }

  const tc = CODE_TYPE_COLORS[code.type] || CODE_TYPE_COLORS.Discount;

  return (
    <div style={{ padding:"28px 40px" }}>
      <button onClick={onBack} style={{ display:"flex", alignItems:"center", gap:8, background:"none", border:"1px solid "+BORDER, borderRadius:6, color:TEXT_SECONDARY, fontSize:12, cursor:"pointer", padding:"7px 14px", marginBottom:20 }}>
        ← Back to Promo Codes
      </button>
      <div style={{ fontFamily:serif, fontSize:22, fontWeight:300, color:GOLD, letterSpacing:"0.02em", marginBottom:20 }}>{code.code}</div>

      <div style={{ display:"grid", gridTemplateColumns:"1fr 300px", gap:20 }}>
        <div style={{ background:DARK_CARD, border:"1px solid "+BORDER, borderRadius:8, overflow:"hidden" }}>

            <div style={{ display:"flex", alignItems:"center", gap:10 }}>
              <span style={{ fontFamily:mono, fontSize:20, fontWeight:600, color:GOLD, letterSpacing:"0.05em" }}>{code.code}</span>
              <span style={{ background:tc.bg, color:tc.color, border:"1px solid "+tc.border, borderRadius:4, padding:"2px 9px", fontSize:11, fontWeight:600 }}>{code.type}</span>
              <span style={{ background: code.active ? "rgba(100,200,100,0.1)" : "rgba(100,100,100,0.1)", color: code.active ? "#7EC87E" : TEXT_MUTED, border:"1px solid "+(code.active ? "rgba(100,200,100,0.3)" : BORDER), borderRadius:4, padding:"2px 9px", fontSize:11, fontWeight:600 }}>{code.active ? "Active" : "Paused"}</span>
            </div>
            <div style={{ display:"flex", gap:8 }}>
              <button style={{ padding:"6px 14px", background:"none", border:"1px solid "+BORDER, borderRadius:6, color:TEXT_SECONDARY, fontSize:12, cursor:"pointer" }}>Edit</button>
              <button onClick={() => onUpdate({...code, active:!code.active})} style={{ padding:"6px 14px", background:"none", border:"1px solid "+BORDER, borderRadius:6, color:TEXT_SECONDARY, fontSize:12, cursor:"pointer" }}>{code.active ? "Pause" : "Resume"}</button>
            </div>
          </div>

          <div style={{ display:"grid", gridTemplateColumns:"repeat(4,1fr)", borderBottom:"1px solid "+BORDER }}>
            {[{val:code.assigned.length,lbl:"Assigned"},{val:redeemed.length,lbl:"Redeemed"},{val:opened.length,lbl:"Opened"},{val:convRate+"%",lbl:"Conversion"}].map((s,i) => (
              <div key={i} style={{ padding:"12px 16px", borderRight: i<3 ? "1px solid "+BORDER : "none" }}>
                <div style={{ fontSize:20, fontWeight:600, color:GOLD, fontFamily:mono }}>{s.val}</div>
                <div style={{ fontSize:11, color:TEXT_MUTED, marginTop:2 }}>{s.lbl}</div>
              </div>
            ))}
          </div>

          <div style={{ display:"flex", borderBottom:"1px solid "+BORDER, paddingLeft:8 }}>

            <div style={{ padding:"32px", textAlign:"center", color:TEXT_MUTED, fontSize:13 }}>No contacts in this category</div>

        <div style={{ display:"flex", flexDirection:"column", gap:14 }}>
          <div style={{ background:DARK_CARD, border:"1px solid "+BORDER, borderRadius:8, padding:16 }}>
            <div style={{ fontSize:11, fontWeight:600, color:TEXT_MUTED, textTransform:"uppercase", letterSpacing:"0.06em", marginBottom:12 }}>Code details</div>
            {[["Applies to",code.tier],["Discount",code.discountType+(code.value?" · "+code.value:"")],["Duration",code.duration||"—"],["Single use",code.singleUse?"Yes":"No"],["One per email",code.onePerEmail?"Yes":"No"],["Max uses",code.maxUses?code.maxUses:"Unlimited"],["Expires",code.expires||"No expiry"],["Campaign",code.campaign||"—"]].map(([l,v]) => (
              <div key={l} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:7 }}>
                <span style={{ fontSize:12, color:TEXT_MUTED }}>{l}</span>
                <span style={{ fontSize:12, color:TEXT_PRIMARY, fontWeight:500 }}>{v}</span>
              </div>
            ))}
            {code.promoMsg && <div style={{ marginTop:8, padding:"8px 10px", background:"rgba(201,169,110,0.08)", borderRadius:6, fontSize:11, color:GOLD, fontStyle:"italic" }}>"{code.promoMsg}"</div>}

            </div>
          </div>

          <div style={{ background:DARK_CARD, border:"1px solid "+BORDER, borderRadius:8, padding:16 }}>
            <div style={{ fontSize:11, fontWeight:600, color:TEXT_MUTED, textTransform:"uppercase", letterSpacing:"0.06em", marginBottom:8 }}>Assign to someone</div>
            <div style={{ fontSize:12, color:TEXT_MUTED, marginBottom:10 }}>Send this code to a specific person and track their redemption</div>
            <div style={{ display:"flex", gap:8 }}>
              <input value={assignEmail} onChange={e => setAssignEmail(e.target.value)} placeholder="email@example.com"
                style={{ flex:1, padding:"7px 10px", background:DARK_BG, border:"1px solid "+BORDER, borderRadius:6, color:TEXT_PRIMARY, fontSize:12, outline:"none" }} />
              <button onClick={handleAssign} style={{ padding:"7px 14px", background:GOLD, border:"none", borderRadius:6, color:DARK_BG, fontSize:12, fontWeight:600, cursor:"pointer" }}>Send</button>
            </div>
            {showAssignDone && <div style={{ fontSize:11, color:"#7EC87E", marginTop:6 }}>Code sent!</div>}
            {notRedeemed.length > 0 && (
              <button onClick={handleRemindAll} style={{ width:"100%", marginTop:10, padding:"8px", background:"none", border:"1px solid "+BORDER, borderRadius:6, color:TEXT_MUTED, fontSize:12, cursor:"pointer" }}>

        </div>
      </div>
    </div>
  );
