<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>SideKix Team Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* ─── SideKix Team Portal ──────────────────────────────────────────────────────
   Every colour here is checked against WCAG AA on the surface it sits on, in
   both themes. Nothing lighter than 4.9:1 carries text. ------------------- */

:root {
  --bg:        #14130E;
  --surface:   #1C1A14;
  --raised:    #262218;
  --line:      #35301F;
  --line-firm: #4C4633;

  --ink:       #F2EDE0;
  --ink-2:     #C4BBA3;
  --ink-3:     #A79D85;

  --gold:      #D9BC7E;
  --gold-bg:   rgba(217,188,126,0.13);
  --gold-line: rgba(217,188,126,0.35);
  --on-gold:   #14130E;

  --good:      #8FD3A0;  --good-bg: rgba(143,211,160,0.13);  --good-line: rgba(143,211,160,0.32);
  --warn:      #E8A06A;  --warn-bg: rgba(232,160,106,0.13);  --warn-line: rgba(232,160,106,0.32);
  --bad:       #EC8C8C;  --bad-bg:  rgba(236,140,140,0.13);  --bad-line:  rgba(236,140,140,0.32);
  --info:      #8FBEEA;  --info-bg: rgba(143,190,234,0.13);  --info-line: rgba(143,190,234,0.32);
  --plum:      #C8A2E8;  --plum-bg: rgba(200,162,232,0.13);  --plum-line: rgba(200,162,232,0.32);

  --focus:     #D9BC7E;
  --shadow:    0 10px 30px rgba(0,0,0,0.45);

  --sans:  'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --serif: 'Cormorant Garamond', Georgia, serif;
  --mono:  'DM Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

  --r-sm: 5px; --r-md: 8px; --r-lg: 12px;
  --gap: 16px;
  color-scheme: dark;
}

[data-theme="light"] {
  --bg:        #F7F4ED;
  --surface:   #FFFFFF;
  --raised:    #EDE8DC;
  --line:      #DED7C7;
  --line-firm: #BEB49C;

  --ink:       #1C1A14;
  --ink-2:     #4A4334;
  --ink-3:     #6B6252;

  --gold:      #7A5C10;
  --gold-bg:   rgba(122,92,16,0.10);
  --gold-line: rgba(122,92,16,0.30);
  --on-gold:   #FFFFFF;

  --good:      #1F6B37;  --good-bg: rgba(31,107,55,0.10);   --good-line: rgba(31,107,55,0.28);
  --warn:      #8A4412;  --warn-bg: rgba(138,68,18,0.10);   --warn-line: rgba(138,68,18,0.28);
  --bad:       #B02A2A;  --bad-bg:  rgba(176,42,42,0.10);   --bad-line:  rgba(176,42,42,0.28);
  --info:      #1B5C94;  --info-bg: rgba(27,92,148,0.10);   --info-line: rgba(27,92,148,0.28);
  --plum:      #6B3FA0;  --plum-bg: rgba(107,63,160,0.10);  --plum-line: rgba(107,63,160,0.28);

  --focus:     #7A5C10;
  --shadow:    0 10px 30px rgba(28,26,20,0.14);
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }

html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.55;
  -webkit-text-size-adjust: 100%;
}
#root { min-height: 100vh; }

/* Focus is never invisible. */
:focus { outline: none; }
:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
  border-radius: 3px;
}

.skip {
  position: absolute; left: 12px; top: -60px; z-index: 2000;
  background: var(--gold); color: var(--on-gold);
  padding: 10px 18px; border-radius: var(--r-sm);
  font-weight: 600; text-decoration: none;
  transition: top .15s;
}
.skip:focus { top: 12px; }

.sr-only {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--line-firm); border-radius: 6px; border: 3px solid var(--bg); }

/* ─── Typography ───────────────────────────────────────────────────────────── */
h1, h2, h3 { margin: 0; font-weight: 500; text-wrap: balance; }
h1 { font-family: var(--serif); font-size: 30px; font-weight: 500; letter-spacing: .01em; line-height: 1.15; }
h2 { font-family: var(--serif); font-size: 21px; letter-spacing: .01em; }
h3 { font-size: 14px; font-weight: 600; }

.eyebrow {
  font-size: 12px; font-weight: 600; letter-spacing: .13em;
  text-transform: uppercase; color: var(--ink-3);
}
.muted { color: var(--ink-3); }
.dim   { color: var(--ink-2); }
.mono  { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.nowrap { white-space: nowrap; }

/* ─── Shell ────────────────────────────────────────────────────────────────── */
.topbar {
  position: sticky; top: 0; z-index: 90;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  padding-top: env(safe-area-inset-top, 0px);
}
.topbar-inner {
  display: flex; align-items: center; gap: 20px;
  padding: 0 clamp(16px, 3vw, 32px);
  min-height: 60px;
}
.wordmark {
  font-family: var(--serif); font-size: 23px; font-weight: 500;
  color: var(--gold); letter-spacing: .05em; flex-shrink: 0;
  display: flex; align-items: baseline; gap: 8px;
}
.wordmark span {
  font-family: var(--sans); font-size: 12px; font-weight: 600;
  letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3);
}

nav.sections { display: flex; gap: 2px; flex: 1; }
nav.sections a {
  display: block; padding: 19px 15px 16px;
  font-size: 13px; font-weight: 500; color: var(--ink-2);
  text-decoration: none; border-bottom: 3px solid transparent;
  white-space: nowrap; border-radius: var(--r-sm) var(--r-sm) 0 0;
}
nav.sections a:hover { color: var(--ink); background: var(--raised); }
nav.sections a[aria-current="page"] {
  color: var(--gold); border-bottom-color: var(--gold); font-weight: 600;
}

.topbar-right { display: flex; align-items: center; gap: 10px; margin-left: auto; }
.who { font-size: 12px; color: var(--ink-3); font-family: var(--mono); }

.drawer { border-bottom: 1px solid var(--line); background: var(--surface); }
.drawer a {
  display: block; padding: 14px 20px; font-size: 15px;
  color: var(--ink-2); text-decoration: none;
  border-left: 4px solid transparent;
}
.drawer a[aria-current="page"] {
  color: var(--gold); background: var(--gold-bg); border-left-color: var(--gold); font-weight: 600;
}

main { padding: clamp(20px, 3vw, 34px) clamp(16px, 3vw, 32px) 80px; }
.page-head { margin-bottom: 26px; }
.page-head p { margin: 6px 0 0; color: var(--ink-2); font-size: 14px; max-width: 70ch; }

/* ─── Buttons ──────────────────────────────────────────────────────────────── */
.btn {
  font: inherit; font-size: 13px; font-weight: 600;
  padding: 9px 16px; border-radius: var(--r-sm);
  border: 1px solid var(--line-firm); background: transparent;
  color: var(--ink); cursor: pointer; white-space: nowrap;
  display: inline-flex; align-items: center; gap: 7px;
  min-height: 38px;
}
.btn:hover:not(:disabled) { background: var(--raised); border-color: var(--ink-3); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--gold); border-color: var(--gold); color: var(--on-gold); }
.btn-primary:hover:not(:disabled) { filter: brightness(1.08); background: var(--gold); border-color: var(--gold); }
.btn-danger { color: var(--bad); border-color: var(--bad-line); }
.btn-danger:hover:not(:disabled) { background: var(--bad-bg); border-color: var(--bad); }
.btn-sm { font-size: 12px; padding: 6px 11px; min-height: 32px; }
.btn-ghost { border-color: transparent; color: var(--ink-2); }
.btn-ghost:hover:not(:disabled) { background: var(--raised); color: var(--ink); border-color: transparent; }
.btn-icon { padding: 8px 10px; min-height: 38px; font-size: 15px; line-height: 1; }

/* ─── Fields ───────────────────────────────────────────────────────────────── */
label.field { display: block; margin-bottom: 14px; }
label.field > span.label,
.label {
  display: block; margin-bottom: 5px;
  font-size: 12px; font-weight: 600; letter-spacing: .07em;
  text-transform: uppercase; color: var(--ink-3);
}
input[type="text"], input[type="email"], input[type="password"],
input[type="date"], input[type="number"], input[type="search"],
select, textarea {
  width: 100%; font: inherit; font-size: 14px;
  padding: 9px 12px; min-height: 40px;
  border: 1px solid var(--line-firm); border-radius: var(--r-sm);
  background: var(--bg); color: var(--ink);
}
[data-theme="light"] input, [data-theme="light"] select, [data-theme="light"] textarea { background: var(--surface); }
textarea { min-height: 96px; resize: vertical; line-height: 1.6; }
input::placeholder, textarea::placeholder { color: var(--ink-3); opacity: 1; }
select { cursor: pointer; }
.hint { font-size: 12px; color: var(--ink-3); margin-top: 5px; }
.err  { font-size: 13px; color: var(--bad); margin-top: 6px; }

.checkbox { display: flex; align-items: center; gap: 9px; font-size: 14px; cursor: pointer; min-height: 32px; }
.checkbox input { width: 17px; height: 17px; min-height: 0; accent-color: var(--gold); cursor: pointer; flex-shrink: 0; }

/* ─── Cards and panels ─────────────────────────────────────────────────────── */
.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-md); padding: 20px;
}
.card + .card { margin-top: var(--gap); }
.card > h2, .card > h3 { margin-bottom: 14px; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 10px; margin-bottom: 22px; }
.stat {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-md); padding: 13px 15px;
  text-align: left; cursor: pointer; font: inherit; color: inherit;
}
.stat:hover { border-color: var(--ink-3); }
.stat[aria-pressed="true"] { border-color: var(--gold); background: var(--gold-bg); }
.stat .n { display: block; font-family: var(--serif); font-size: 27px; line-height: 1.1; color: var(--ink); font-variant-numeric: tabular-nums; }
.stat .k { display: block; font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin-top: 3px; }

/* ─── Tags ─────────────────────────────────────────────────────────────────── */
.tag {
  display: inline-block; font-size: 12px; font-weight: 500;
  padding: 3px 9px; border-radius: 4px; white-space: nowrap;
  border: 1px solid transparent;
}
.tag-gold { background: var(--gold-bg); color: var(--gold); border-color: var(--gold-line); }
.tag-good { background: var(--good-bg); color: var(--good); border-color: var(--good-line); }
.tag-warn { background: var(--warn-bg); color: var(--warn); border-color: var(--warn-line); }
.tag-bad  { background: var(--bad-bg);  color: var(--bad);  border-color: var(--bad-line); }
.tag-info { background: var(--info-bg); color: var(--info); border-color: var(--info-line); }
.tag-plum { background: var(--plum-bg); color: var(--plum); border-color: var(--plum-line); }
.tag-flat { background: var(--raised); color: var(--ink-2); border-color: var(--line-firm); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }

/* ─── Toolbar ──────────────────────────────────────────────────────────────── */
.toolbar {
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
  margin-bottom: 16px;
}
.toolbar .grow { flex: 1 1 220px; min-width: 180px; }
.toolbar select { width: auto; min-width: 140px; }

/* ─── Tables ───────────────────────────────────────────────────────────────── */
.table-wrap {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-md); overflow-x: auto;
}
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { padding: 12px 14px; text-align: left; vertical-align: middle; }
thead th {
  font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink-3); border-bottom: 1px solid var(--line-firm);
  background: var(--surface); position: sticky; top: 0; z-index: 2;
}
tbody tr { border-bottom: 1px solid var(--line); }
tbody tr:last-child { border-bottom: none; }
tbody tr.clickable { cursor: pointer; }
tbody tr.clickable:hover { background: var(--raised); }
tbody tr.clickable:focus-within { background: var(--raised); }
td.name { font-weight: 500; }
td .sub { display: block; font-size: 12px; color: var(--ink-3); font-family: var(--mono); margin-top: 2px; }
.count-line { margin-top: 12px; font-size: 13px; color: var(--ink-3); }

.avatar {
  width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
  background: var(--raised); border: 1px solid var(--line-firm);
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 600; color: var(--gold);
}

/* ─── Menus ────────────────────────────────────────────────────────────────── */
.menu {
  position: absolute; right: 0; top: calc(100% + 4px); z-index: 60;
  background: var(--surface); border: 1px solid var(--line-firm);
  border-radius: var(--r-md); box-shadow: var(--shadow);
  min-width: 190px; overflow: hidden; padding: 4px;
}
.menu button {
  display: block; width: 100%; text-align: left;
  padding: 10px 12px; font: inherit; font-size: 14px;
  background: none; border: none; color: var(--ink-2);
  cursor: pointer; border-radius: var(--r-sm);
}
.menu button:hover { background: var(--raised); color: var(--ink); }
.menu button.danger { color: var(--bad); }
.menu button.danger:hover { background: var(--bad-bg); }

/* ─── Modal ────────────────────────────────────────────────────────────────── */
.scrim {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(10,9,6,0.72);
  display: flex; align-items: flex-start; justify-content: center;
  padding: clamp(0px, 3vh, 34px) clamp(0px, 3vw, 24px);
  overflow-y: auto;
}
.modal {
  background: var(--bg); border: 1px solid var(--line-firm);
  border-radius: var(--r-lg); width: 100%; max-width: 980px;
  box-shadow: var(--shadow);
}
.modal-head {
  display: flex; gap: 14px; align-items: flex-start;
  padding: 20px 24px; border-bottom: 1px solid var(--line);
  position: sticky; top: 0; background: var(--bg); z-index: 3;
  border-radius: var(--r-lg) var(--r-lg) 0 0;
}
.modal-head .who-block { flex: 1; min-width: 0; }
.modal-head h2 { margin-bottom: 3px; }
.modal-body { padding: 22px 24px 28px; }
.modal-actions { display: flex; gap: 8px; flex-shrink: 0; flex-wrap: wrap; }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); padding: 0 24px; }
.tabs button {
  font: inherit; font-size: 13px; font-weight: 500;
  padding: 12px 15px; background: none; border: none;
  border-bottom: 3px solid transparent; color: var(--ink-2);
  cursor: pointer; margin-bottom: -1px;
}
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--gold); border-bottom-color: var(--gold); font-weight: 600; }

/* ─── Detail grid: the fix for fields landing in the wrong place ───────────── */
.detail-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; align-items: start; }
.group { border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; }
.group + .group { margin-top: var(--gap); }
.group > h3 {
  padding: 11px 15px; background: var(--raised);
  border-bottom: 1px solid var(--line);
  font-size: 12px; font-weight: 600; letter-spacing: .1em;
  text-transform: uppercase; color: var(--ink-2);
}
.group-body { padding: 15px; background: var(--surface); }
.pairs { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px 18px; }
.pair .label { margin-bottom: 3px; }
.pair .val { font-size: 14px; color: var(--ink); overflow-wrap: anywhere; }
.pair .val-empty { color: var(--ink-3); font-style: italic; }
.pair a { color: var(--gold); }
.prose { font-size: 14px; color: var(--ink-2); line-height: 1.75; white-space: pre-wrap; overflow-wrap: anywhere; }

.choices { display: flex; flex-wrap: wrap; gap: 7px; }
.choice {
  font: inherit; font-size: 13px; font-weight: 500;
  padding: 7px 13px; border-radius: var(--r-sm);
  border: 1px solid var(--line-firm); background: transparent;
  color: var(--ink-2); cursor: pointer; min-height: 36px;
}
.choice:hover { border-color: var(--ink-3); color: var(--ink); }
.choice[aria-pressed="true"] { background: var(--gold-bg); border-color: var(--gold); color: var(--gold); font-weight: 600; }

/* ─── Toasts ───────────────────────────────────────────────────────────────── */
.toasts {
  position: fixed; bottom: 20px; right: 20px; z-index: 900;
  display: flex; flex-direction: column; gap: 9px;
  max-width: min(400px, calc(100vw - 40px));
}
.toast {
  background: var(--surface); border: 1px solid var(--line-firm);
  border-left: 4px solid var(--gold);
  border-radius: var(--r-md); padding: 12px 16px;
  font-size: 14px; box-shadow: var(--shadow); color: var(--ink);
}
.toast.ok  { border-left-color: var(--good); }
.toast.bad { border-left-color: var(--bad); }

/* ─── States ───────────────────────────────────────────────────────────────── */
.empty-state {
  padding: 46px 24px; text-align: center; color: var(--ink-3);
  background: var(--surface); border: 1px dashed var(--line-firm);
  border-radius: var(--r-md);
}
.empty-state strong { display: block; color: var(--ink-2); font-size: 16px; margin-bottom: 6px; font-weight: 500; }
.banner {
  border: 1px solid var(--warn-line); background: var(--warn-bg);
  color: var(--ink); border-radius: var(--r-md);
  padding: 13px 16px; font-size: 14px; margin-bottom: var(--gap);
}
.banner.bad { border-color: var(--bad-line); background: var(--bad-bg); }

/* ─── Sign in ──────────────────────────────────────────────────────────────── */
.signin { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
.signin-card { width: 100%; max-width: 400px; text-align: center; }
.signin-card .card { margin-top: 26px; }

/* ─── Responsive ───────────────────────────────────────────────────────────── */
@media (max-width: 900px) {
  .detail-cols { grid-template-columns: 1fr; }
}
@media (max-width: 760px) {
  body { font-size: 15px; }
  .modal { border-radius: 0; border: none; min-height: 100vh; }
  .scrim { padding: 0; }
  .modal-head { border-radius: 0; }
  .tabs { padding: 0 16px; overflow-x: auto; }
  .modal-body { padding: 18px 16px 30px; }
  th, td { padding: 11px 12px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

@media print {
  .topbar, .toolbar, .modal-actions, .toasts { display: none !important; }
}

</style>
</head>

<div id="root"></div>
<script>
/* The Google client that signs the team in. Public by design: a client ID is
   not a secret, and the server checks every token against it. */
window.SIDEKIX_GOOGLE_CLIENT_ID = "146726489871-tte0qahk8329a6p4ndsbsgalafhokesj.apps.googleusercontent.com";
</script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
/* ─── SideKix Team Portal ──────────────────────────────────────────────────────
   Authored as JSX and compiled before shipping, so the browser never has to
   carry a compiler or parse this file twice. ------------------------------- */

const {
  useState,
  useEffect,
  useMemo,
  useRef,
  useCallback
} = React;
const SERVER = "https://sidekix-email-server.onrender.com";
const DOMAIN = "sidekixhq.com";
const DOCS_URL = "https://sidekixhq.github.io/sidekix-docs/";

/* Filled in once the Google client exists. Kept overridable so the portal can
   be pointed at a different client without another deploy. */
const GOOGLE_CLIENT_ID = function () {
  try {
    return localStorage.getItem("sidekix-google-client-id") || window.SIDEKIX_GOOGLE_CLIENT_ID || "";
  } catch (e) {
    return window.SIDEKIX_GOOGLE_CLIENT_ID || "";
  }
}();

/* ─── Session ──────────────────────────────────────────────────────────────── */
const Session = {
  read() {
    try {
      const raw = sessionStorage.getItem("sidekix-session");
      if (!raw) return null;
      const s = JSON.parse(raw);
      if (!s || !s.token || !s.expires || s.expires < Date.now()) return null;
      return s;
    } catch (e) {
      return null;
    }
  },
  write(s) {
    try {
      sessionStorage.setItem("sidekix-session", JSON.stringify(s));
    } catch (e) {}
  },
  clear() {
    try {
      sessionStorage.removeItem("sidekix-session");
    } catch (e) {}
  }
};
let onUnauthorised = () => {};

/* ─── API ──────────────────────────────────────────────────────────────────── */
async function api(path, options) {
  const opts = options || {};
  const session = Session.read();
  const headers = Object.assign({}, opts.headers || {});
  if (opts.body) headers["Content-Type"] = "application/json";
  if (session) headers["Authorization"] = "Bearer " + session.token;
  const res = await fetch(SERVER + path, {
    method: opts.method || "GET",
